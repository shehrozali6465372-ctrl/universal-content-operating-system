<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>UCOS Personal Browser Console</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:16px;background:#f5f7fa}input,button{font:inherit;padding:10px;margin:4px;border-radius:8px;border:1px solid #bbb;box-sizing:border-box}input{width:100%}.card{background:#fff;padding:14px;margin:12px 0;border-radius:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}img{width:100%;max-height:65vh;object-fit:contain;background:#111}pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#111;color:#eee;padding:10px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><h1>UCOS Personal Browser Console</h1><div class='card'><p>Manual authenticated browser session. CAPTCHA/2FA must be completed manually.</p><label>UCOS Browser Token</label><input id='token' type='password' autocomplete='off'><div class='row'><div><label>Profile</label><input id='profile' value='amazon-primary'></div><div><label>URL</label><input id='url' value='https://www.amazon.com/ap/signin'></div></div><button onclick='go()'>Open / navigate</button><button onclick='newTab()'>＋ New tab</button><button onclick='listTabs()'>List tabs</button><button onclick='switchTab()'>Switch tab #</button><button onclick='closeTab()'>Close tab</button><input id='tabIndex' type='number' min='0' value='0' aria-label='Tab index'><button onclick='navAction("back")'>← Back</button><button onclick='navAction("forward")'>Forward →</button><button onclick='navAction("reload")'>↻ Reload</button><button onclick='bookmarkCurrent()'>☆ Bookmark URL</button><button onclick='showBookmarks()'>Bookmarks</button><button onclick='showHistory()'>History</button><button onclick='inspect()'>Inspect</button><button onclick='shot()'>Refresh screenshot</button><button onclick='clearToken()'>Clear token</button></div><div class='card'><div class='row'><div><label>CSS selector</label><input id='selector' placeholder='#ap_email'></div><div><label>Value</label><input id='value'></div></div><button onclick='fillField()'>Fill field</button><button onclick='fillAndEnter()'>Fill + Enter</button><button onclick='clickField()'>Click selector</button><button onclick='pressEnter()'>Press Enter</button></div><div class='card'><img id='screen' alt='Remote browser screenshot'><div id='status'></div></div><div class='card'><b>Controls</b><pre id='elements'>No inspection yet.</pre></div><div class='card'><b>Result</b><pre id='result'>Ready.</pre></div><script>const $=id=>document.getElementById(id);const key='ucos_browser_console_token';$('token').value=sessionStorage.getItem(key)||'';function headers(){const t=$('token').value.trim();if(!t)throw Error('Enter the UCOS Browser Token');sessionStorage.setItem(key,t);return {'Authorization':'Bearer '+t,'Content-Type':'application/json'}}async function task(actions){const r=await fetch('/execute',{method:'POST',headers:headers(),body:JSON.stringify({profile_ref:$('profile').value.trim()||'amazon-primary',url:$('url').value.trim(),actions})});const x=await r.json();$('result').textContent=JSON.stringify(x,null,2);if(!r.ok)throw Error(x.error||'Request failed');return x}function show(x){const h=x?.result?.screenshot;if(h){const b=new Uint8Array(h.match(/../g).map(v=>parseInt(v,16)));$('screen').src=URL.createObjectURL(new Blob([b],{type:'image/png'}))}$('status').textContent=x?.result?.final_url||'';$('elements').textContent=JSON.stringify(x?.result?.elements||[],null,2)}function saveHistory(url){try{if(!url)return;const k='ucos_browser_history';const xs=JSON.parse(localStorage.getItem(k)||'[]');const next=[{url,at:new Date().toISOString()},...xs.filter(x=>x.url!==url)].slice(0,100);localStorage.setItem(k,JSON.stringify(next))}catch(e){}}function bookmarkCurrent(){const url=$('status').textContent||$('url').value.trim();if(!url)return;const k='ucos_browser_bookmarks';const xs=JSON.parse(localStorage.getItem(k)||'[]');if(!xs.some(x=>x.url===url))xs.unshift({url,title:url});localStorage.setItem(k,JSON.stringify(xs.slice(0,100)));$('result').textContent='Bookmarked: '+url}function showBookmarks(){const xs=JSON.parse(localStorage.getItem('ucos_browser_bookmarks')||'[]');$('elements').textContent=JSON.stringify(xs,null,2);if(xs.length){$('url').value=xs[0].url}}function showHistory(){const xs=JSON.parse(localStorage.getItem('ucos_browser_history')||'[]');$('elements').textContent=JSON.stringify(xs,null,2);if(xs.length){$('url').value=xs[0].url}}async function go(){try{const x=await task([{type:'navigate',url:$('url').value.trim()},{type:'inspect'},{type:'screenshot'}]);show(x);saveHistory(x?.result?.final_url)}catch(e){$('result').textContent=e.message}}async function newTab(){try{const x=await task([{type:'new_tab',url:$('url').value.trim()},{type:'inspect'},{type:'screenshot'},{type:'list_tabs'}]);show(x);saveHistory(x?.result?.final_url)}catch(e){$('result').textContent=e.message}}async function listTabs(){try{const x=await task([{type:'list_tabs'}]);$('elements').textContent=JSON.stringify(x.result.tabs||[],null,2)}catch(e){$('result').textContent=e.message}}async function switchTab(){try{show(await task([{type:'switch_tab',index:Number($('tabIndex').value)},{type:'inspect'},{type:'screenshot'},{type:'list_tabs'}]))}catch(e){$('result').textContent=e.message}}async function closeTab(){try{show(await task([{type:'close_tab'},{type:'inspect'},{type:'screenshot'},{type:'list_tabs'}]))}catch(e){$('result').textContent=e.message}}async function navAction(kind){try{show(await task([{type:kind},{type:'inspect'},{type:'screenshot'}]))}catch(e){$('result').textContent=e.message}}async function inspect(){try{show(await task([{type:'inspect'},{type:'screenshot'}]))}catch(e){$('result').textContent=e.message}}async function shot(){try{show(await task([{type:'screenshot'},{type:'inspect'}]))}catch(e){$('result').textContent=e.message}}async function fillField(){try{const x=await task([{type:'fill',selector:$('selector').value.trim(),value:$('value').value},{type:'screenshot'},{type:'inspect'}]);$('value').value='';show(x)}catch(e){$('result').textContent=e.message}}async function fillAndEnter(){try{const x=await task([{type:'fill',selector:$('selector').value.trim(),value:$('value').value},{type:'press',selector:$('selector').value.trim(),key:'Enter'},{type:'wait',ms:1500},{type:'screenshot'},{type:'inspect'}]);$('value').value='';show(x)}catch(e){$('result').textContent=e.message}}async function clickField(){try{show(await task([{type:'click',selector:$('selector').value.trim()},{type:'screenshot'},{type:'inspect'}]))}catch(e){$('result').textContent=e.message}}async function pressEnter(){try{show(await task([{type:'press',selector:$('selector').value.trim(),key:'Enter'},{type:'wait',ms:1200},{type:'screenshot'},{type:'inspect'}]))}catch(e){$('result').textContent=e.message}}function clearToken(){sessionStorage.removeItem(key);$('token').value=''}</script></body></html>
