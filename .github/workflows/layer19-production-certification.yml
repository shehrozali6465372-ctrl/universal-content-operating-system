name: Layer 19 Production Certification
# Production gate: compile, tests, lint, and repository hygiene must all pass.

on:
  push:
    branches: [main]
    paths:
      - "layers/layer19_analytics_engine/**"
      - "tests/test_bi_platform_enterprise.py"
      - "tests/layer19_analytics_engine/**"
      - ".github/workflows/layer19-production-certification.yml"
  pull_request:
    branches: [main]
    paths:
      - "layers/layer19_analytics_engine/**"
      - "tests/test_bi_platform_enterprise.py"
      - "tests/layer19_analytics_engine/**"
      - ".github/workflows/layer19-production-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer19-production-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-certification:
    name: Layer 19 production certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install certification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Compile Layer 19
        run: python -m compileall -q layers/layer19_analytics_engine

      - name: Layer 19 enterprise tests
        run: |
          python -m pytest             tests/test_bi_platform_enterprise.py             tests/layer19_analytics_engine/test_production_certification.py             -q --tb=short

      - name: Layer 19 production lint
        run: |
          ruff check             layers/layer19_analytics_engine             tests/layer19_analytics_engine             tests/test_bi_platform_enterprise.py             --select E,F,W             --ignore E501,E402

      - name: Repository diff hygiene
        run: git diff --check

      - name: Emit certification result
        run: |
          echo "Layer 19 verification: PASS"
          echo "Layer 19 production certification: CERTIFIED"
