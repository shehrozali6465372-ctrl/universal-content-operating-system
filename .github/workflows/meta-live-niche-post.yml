name: UCOS Deep End-to-End Live System Test

on:
  push:
    paths:
      - .github/workflows/meta-live-niche-post.yml
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ucos-deep-e2e-live
  cancel-in-progress: false

jobs:
  deep-e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_VERSION: v25.0

    steps:
      - name: Checkout exact UCOS revision
        uses: actions/checkout@v4

      - name: Deep repository structure and Python integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UCOS DEEP SYSTEM CHECK ==="
          echo "COMMIT=${GITHUB_SHA}"
          echo "BRANCH=${GITHUB_REF_NAME}"
          LAYER_COUNT=$(find layers -maxdepth 1 -mindepth 1 -type d -name 'layer*' | wc -l | tr -d ' ')
          PY_COUNT=$(find layers -type f -name '*.py' | wc -l | tr -d ' ')
          echo "LAYER_COUNT=${LAYER_COUNT}"
          echo "PYTHON_SOURCE_FILE_COUNT=${PY_COUNT}"
          find layers -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort
          test "${LAYER_COUNT}" -ge 23
          test -f layers/layer14_enterprise_integration/modules/api_gateway/api_gateway.py
          test -f layers/layer23_website_manager/integration/atoz_bridge.py
          test -f layers/layer23_website_manager/integration/__init__.py
          python3 -m compileall -q .
          echo "STRUCTURE_AND_COMPILE=PASS"

      - name: Run existing automated tests
        shell: bash
        run: |
          set -uo pipefail
          TEST_FILES=$(find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | wc -l | tr -d ' ')
          echo "TEST_FILE_COUNT=${TEST_FILES}"
          if [ "${TEST_FILES}" -eq 0 ]; then
            echo "AUTOMATED_TESTS=NO_TEST_FILES_FOUND"
            exit 0
          fi
          python3 -m pip install -q pytest
          python3 -m pytest -q
          RC=$?
          if [ "${RC}" -ne 0 ]; then
            echo "AUTOMATED_TESTS=FAIL"
            exit "${RC}"
          fi
          echo "AUTOMATED_TESTS=PASS"

      - name: Verify UCOS integration code paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("layers").rglob("*.py"))
          all_text = "\n".join(p.read_text(errors="ignore") for p in files)
          checks = {
              "layer14_api_gateway": Path("layers/layer14_enterprise_integration/modules/api_gateway/api_gateway.py").exists(),
              "layer23_website_manager": Path("layers/layer23_website_manager/integration/atoz_bridge.py").exists(),
              "heartbeat_route": "/heartbeat" in all_text,
              "job_route": "/v1/jobs" in all_text,
              "hmac_transport_auth": "hmac" in all_text.lower(),
              "layer23_dispatch": "Layer 23" in all_text or "layer23" in all_text.lower(),
          }
          for k,v in checks.items():
              print(f"INTEGRATION_{k.upper()}={'PASS' if v else 'FAIL'}")
          if not all(checks.values()):
              raise SystemExit(20)
          print("INTEGRATION_TRACE=PASS")
          PY

      - name: REAL Meta E2E — authenticate, discover, publish, and verify 12 Facebook + 11 Instagram
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          TOKEN=os.environ["META_ACCESS_TOKEN"]
          VERSION=os.environ["META_GRAPH_VERSION"]
          BASE=f"https://graph.facebook.com/{VERSION}"
          MARKER="UCOS-E2E-REAL-LIVE-" + datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")

          FB_POSTS={
            "DealNest Daily":"UCOS E2E live test — smart shopping: compare price, reviews, and useful features before buying.",
            "FitNest Daily":"UCOS E2E live test — build fitness through repeatable training, movement, recovery, and balanced habits.",
            "KitchenNest Daily":"UCOS E2E live test — practical kitchen systems: prep first, keep tools accessible, and clean as you go.",
            "GlowNest Daily":"UCOS E2E live test — keep skincare practical with gentle care, sun protection, and a maintainable routine.",
            "PawTech Daily":"UCOS E2E live test — useful pet technology should support attention, play, and responsible everyday care.",
            "AI Tools Daily":"UCOS E2E live test — automate one repetitive task, verify the output, and measure the real time saved.",
            "HomeCraft Daily":"UCOS E2E live test — measure, plan materials, and start home improvements with small reversible changes.",
            "WellnessNest Daily":"UCOS E2E live test — sustainable wellness starts with sleep, movement, nutrition, hydration, and recovery.",
            "BabyNest Daily":"UCOS E2E live test — simple preparation and flexible routines can make busy parenting days easier.",
            "MoneyWise Daily":"UCOS E2E live test — track income, fixed costs, flexible spending, savings, and debt using real numbers.",
            "jungle toon":"UCOS E2E live test — imagination turns ordinary moments into playful stories, drawings, and adventures.",
            "deeplora":"UCOS E2E live test — ask what something does, why it matters, and what evidence supports it before accepting a claim."
          }
          IG_POSTS={
            "vellorastyle100":("UCOS E2E live test — personal style starts with pieces you genuinely enjoy wearing. #Fashion #Style","https://images.unsplash.com/photo-1445205170230-053b83016050?fm=jpg&fit=crop&w=1080&q=85"),
            "lumevora.beauty":("UCOS E2E live test — practical beauty starts with gentle care, sun protection, and a routine that fits. #Beauty #Skincare","https://images.unsplash.com/photo-1596462502278-27bfdc403348?fm=jpg&fit=crop&w=1080&q=85"),
            "aivora100":("UCOS E2E live test — start AI with one real problem, clear context, verification, and measurable results. #AI #AITools","https://images.unsplash.com/photo-1677442136019-21780ecad995?fm=jpg&fit=crop&w=1080&q=85"),
            "wellvorahub":("UCOS E2E live test — protect sleep, move regularly, eat nourishing food, and build repeatable recovery habits. #Wellness","https://images.unsplash.com/photo-1506126613408-eca07ce68773?fm=jpg&fit=crop&w=1080&q=85"),
            "petvoracare":("UCOS E2E live test — combine attention, play, organized essentials, and useful tools for better pet care. #PetCare","https://images.unsplash.com/photo-1450778869180-41d0601e046e?fm=jpg&fit=crop&w=1080&q=85"),
            "maje_rcim":("UCOS E2E live test — financial visibility starts with tracking income, essential costs, savings, and debt. #Finance #MoneyTips","https://images.unsplash.com/photo-1559526324-593bc073d938?fm=jpg&fit=crop&w=1080&q=85"),
            "homeloradaily":("UCOS E2E live test — useful home design starts with storage, flow, and practical improvements. #Home #InteriorDesign","https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?fm=jpg&fit=crop&w=1080&q=85"),
            "ecoveloradaily":("UCOS E2E live test — reuse, reduce unnecessary purchases, repair when practical, and choose durable options. #Sustainability #EcoLiving","https://images.unsplash.com/photo-1497435334941-8c899ee9e8e9?fm=jpg&fit=crop&w=1080&q=85"),
            "prodivolab":("UCOS E2E live test — before buying, ask whether a product solves a real problem and justifies its price. #ProductDiscovery","https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?fm=jpg&fit=crop&w=1080&q=85"),
            "fitvorahq":("UCOS E2E live test — consistency beats all-or-nothing training; recover properly and progress gradually. #Fitness #Workout","https://images.unsplash.com/photo-1538805060514-97d9cc17730c?fm=jpg&fit=crop&w=1080&q=85"),
            "kingmakerbnb":("UCOS E2E live test — great short stays depend on accurate listings, clean spaces, clear check-in, and communication. #Airbnb #Hospitality","https://images.unsplash.com/photo-1564013799919-ab600027ffc6?fm=jpg&fit=crop&w=1080&q=85")
          }

          def req(method,path,params):
            if method=="GET":
              u=BASE+path+"?"+urllib.parse.urlencode(params)
              q=urllib.request.Request(u,method="GET")
            else:
              q=urllib.request.Request(BASE+path,data=urllib.parse.urlencode(params).encode(),headers={"Content-Type":"application/x-www-form-urlencoded"},method="POST")
            try:
              with urllib.request.urlopen(q,timeout=45) as r:
                return r.status,json.loads(r.read().decode())
            except urllib.error.HTTPError as e:
              raw=e.read().decode("utf-8","replace")
              try:return e.code,json.loads(raw)
              except:return e.code,{"error":{"message":raw[:1000]}}

          if not TOKEN:
            print("META_TOKEN=FAIL_EMPTY"); raise SystemExit(30)
          print("META_TOKEN=PASS_PRESENT")

          st,me=req("GET","/me",{"fields":"id,name","access_token":TOKEN})
          print(f"META_AUTH_HTTP={st}")
          if st!=200 or not me.get("id"):
            print("META_AUTH=FAIL"); raise SystemExit(31)
          print(f"META_AUTH=PASS id={me['id']} name={me.get('name','')}")

          st,p=req("GET","/me/accounts",{"fields":"id,name,access_token,tasks,instagram_business_account{id,username,name}","limit":"100","access_token":TOKEN})
          print(f"ACCOUNT_DISCOVERY_HTTP={st}")
          if st!=200 or "data" not in p:
            print("ACCOUNT_DISCOVERY=FAIL"); raise SystemExit(32)

          pages=p["data"]
          print(f"FACEBOOK_DISCOVERED={len(pages)}")
          if len(pages)!=12: raise SystemExit(33)

          fb_ok=fb_verify=ig_ok=ig_verify=0
          ig_names=[]
          for page in pages:
            name=str(page.get("name","")); pid=str(page.get("id","")); pt=page.get("access_token")
            if name not in FB_POSTS:
              print(f"FACEBOOK_MAPPING_FAIL name={name}"); raise SystemExit(34)

            st,out=req("POST",f"/{pid}/feed",{"message":FB_POSTS[name]+" "+MARKER,"access_token":pt})
            post_id=out.get("id") if st==200 else None
            if not post_id:
              print(f"FACEBOOK_POST_FAIL name={name} http={st} error={json.dumps(out.get('error',out),separators=(',',':'))[:600]}")
              continue
            fb_ok+=1
            print(f"FACEBOOK_POSTED name={name} id={post_id}")

            vst,v=req("GET",f"/{post_id}",{"fields":"id,message,created_time","access_token":pt})
            if vst==200 and v.get("id")==post_id and MARKER in v.get("message",""):
              fb_verify+=1
              print(f"FACEBOOK_VERIFIED name={name} id={post_id}")
            else:
              print(f"FACEBOOK_VERIFY_FAIL name={name} http={vst}")

            ig=page.get("instagram_business_account") or {}
            username=str(ig.get("username","")); igid=str(ig.get("id",""))
            if username: ig_names.append(username)
            if username not in IG_POSTS or not igid: continue

            cap,img=IG_POSTS[username]
            st,c=req("POST",f"/{igid}/media",{"image_url":img,"caption":cap+" "+MARKER,"access_token":pt})
            cid=c.get("id") if st==200 else None
            if not cid:
              print(f"INSTAGRAM_CONTAINER_FAIL username={username} http={st} error={json.dumps(c.get('error',c),separators=(',',':'))[:600]}")
              continue

            finished=False; status_code=""
            for _ in range(18):
              time.sleep(5)
              s,state=req("GET",f"/{cid}",{"fields":"status_code,status","access_token":pt})
              status_code=state.get("status_code","")
              if s==200 and status_code=="FINISHED":
                finished=True; break
              if status_code in {"ERROR","EXPIRED"}: break
            if not finished:
              print(f"INSTAGRAM_STATUS_FAIL username={username} status={status_code}"); continue

            st,pub=req("POST",f"/{igid}/media_publish",{"creation_id":cid,"access_token":pt})
            media_id=pub.get("id") if st==200 else None
            if not media_id:
              print(f"INSTAGRAM_PUBLISH_FAIL username={username} http={st} error={json.dumps(pub.get('error',pub),separators=(',',':'))[:600]}")
              continue
            ig_ok+=1
            print(f"INSTAGRAM_POSTED username={username} id={media_id}")

            vst,v=req("GET",f"/{media_id}",{"fields":"id,caption,timestamp,permalink,media_type","access_token":pt})
            if vst==200 and v.get("id")==media_id and MARKER in v.get("caption",""):
              ig_verify+=1
              print(f"INSTAGRAM_VERIFIED username={username} id={media_id} permalink={v.get('permalink','')}")
            else:
              print(f"INSTAGRAM_VERIFY_FAIL username={username} http={vst}")

          print(f"FACEBOOK_FINAL posted={fb_ok}/12 verified={fb_verify}/12")
          print(f"INSTAGRAM_FINAL posted={ig_ok}/11 verified={ig_verify}/11")
          print(f"INSTAGRAM_LINKED_DISCOVERED={len(set(ig_names))}")
          if fb_ok!=12 or fb_verify!=12 or ig_ok!=11 or ig_verify!=11:
            print("FINAL_RESULT=FAIL")
            raise SystemExit(35)
          print("FINAL_RESULT=PASS_REAL_23_POSTS_23_VERIFIED")
          PY
