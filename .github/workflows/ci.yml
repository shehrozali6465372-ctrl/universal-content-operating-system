name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Create Virtual Environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pyyaml cryptography openai ruff

      - name: Run Tests
        run: |
          pytest tests/ layers/layer01_core/tests/ layers/layer02_research/tests/ -q --tb=short

      - name: System Status
        run: python main.py --status
