name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: aios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r requirements.txt

      - name: Compile
        run: python -m compileall -q layers tests tools main.py

      - name: Layer 1 gate
        env:
          APP_ENV: test
        run: |
          python -m pytest tests/test_layer1_production_gate.py tests/test_layer1_runtime.py tests/test_layer1_code_audit.py -q --tb=short
          python tools/layer1_code_audit.py --json layer1-code-audit.json

      - name: Layer 5 gate
        run: python -m pytest tests/unit/layer05_image -q --tb=short

      - name: Layer 10 gate
        run: python -m pytest tests/layer10_monetization tests/test_layer10_production_gate.py -q --tb=short

      - name: Layer 13 PostgreSQL gate
        run: python -m pytest tests/layer13_persistence/test_layer13_postgresql_real_production.py -q --tb=short

      - name: Layer 14 gate
        run: python -m pytest tests/test_layer14_production_gate.py tests/test_layer14_integration.py tests/test_pinterest_token_refresh_lifecycle.py -q --tb=short

      - name: Layer 15 gate
        run: python -m pytest tests/test_layer15_production_gate.py -q --tb=short

      - name: Integration contracts
        run: python -m pytest tests/test_real_integration_contracts.py -q --tb=short

      - name: System status
        run: |
          python main.py --boot
          python main.py --integration-status

      - name: Upload Layer 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer1-code-audit
          path: layer1-code-audit.json
          if-no-files-found: ignore
