name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ucos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: ${{ github.workspace }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: aios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install --break-system-packages --upgrade pip
          pip install --break-system-packages -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Layer 1 Static Code Audit
        run: |
          python tools/layer1_code_audit.py --json layer1-code-audit.json

      - name: Upload Layer 1 Audit
        uses: actions/upload-artifact@v4
        with:
          name: layer1-code-audit
          path: layer1-code-audit.json

      - name: Run Integration Contract Tests
        run: python -m pytest tests/test_real_integration_contracts.py -q --tb=short

      - name: Run Full Test Suite
        run: python -m pytest -q --tb=short

      - name: System Status
        run: |
          python main.py --boot
          python main.py --integration-status
