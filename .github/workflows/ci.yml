name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: aios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r requirements.txt

      - name: UCOS architecture dependency audit
        run: python tools/ucos_architecture_audit.py --json ucos-architecture-audit.json --fail-on-syntax-errors --fail-on-scaffold-success-patterns --fail-on-unresolved-internal-imports --fail-on-unowned-layer-modules

      - name: UCOS architecture audit regression tests
        run: python -m pytest tests/test_ucos_architecture_audit.py -q --tb=short

      - name: Layer 12 real model execution integrity
        run: python -m pytest tests/test_layer12_ai_foundation.py tests/test_layer12_production_contracts.py tests/unit/layer12_ai_foundation/test_parallel_execution.py -q --tb=short

      - name: Gemini provider adapter regression
        run: python -m pytest tests/test_gemini_real_api.py -q --tb=short

      - name: Compile
        run: python -m compileall -q layers agents tests tools scripts main.py

      - name: Agent 01 contract gates
        env:
          APP_ENV: test
        run: python -m pytest tests/agents/test_agent_01_research_discovery.py tests/agents/test_account_data_store_neon.py tests/agents/test_account_data_store_neon_integration.py tests/agents/test_agent_dispatcher.py tests/agents/test_tavily_research_source.py tests/agents/test_gdelt_context_source.py tests/agents/test_agent01_production_preflight.py tests/agents/test_agent01_pinterest_history_import_guards.py tests/agents/test_account_registry_platform_enabled.py tests/agents/test_agent01_live_certification_gate.py -q --tb=short

      - name: Layer 1 gate
        env:
          APP_ENV: test
        run: |
          python -m pytest tests/test_layer1_production_gate.py tests/test_layer1_runtime.py tests/test_layer1_code_audit.py tests/unit/test_sql_identifier.py -q --tb=short
          python tools/layer1_code_audit.py --json layer1-code-audit.json

      - name: Layer 5 gate
        run: python -m pytest tests/unit/layer05_image -q --tb=short

      - name: Layer 10 gate
        run: python -m pytest tests/layer10_monetization tests/test_layer10_production_gate.py -q --tb=short

      - name: Layer 13 PostgreSQL gate
        run: python -m pytest tests/layer13_persistence/test_layer13_postgresql_real_production.py tests/unit/test_layer13_postgresql_production_hardening.py tests/unit/layer13_persistence/test_memory_store_retrieval.py tests/unit/layer13_persistence/test_vector_math.py -q --tb=short

      - name: Layer 14 gate
        run: python -m pytest tests/test_layer14_production_gate.py tests/test_layer14_integration.py tests/test_pinterest_token_refresh_lifecycle.py -q --tb=short

      - name: Layer 15 gate
        run: python -m pytest tests/test_layer15_production_gate.py -q --tb=short

      - name: Layer 18 monitoring regression
        run: python -m pytest tests/test_phase5_monitoring.py -q --tb=short

      - name: Integration contracts
        run: python -m pytest tests/test_real_integration_contracts.py -q --tb=short

      - name: Personal Browser security regression tests
        run: python -m pytest tests/test_browser_session_health_auth.py -q --tb=short

      - name: System status
        run: |
          python -m pytest tests/test_main_subsystem_status.py -q --tb=short
          python main.py --boot
          python main.py --integration-status

      - name: Upload Layer 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer1-code-audit
          path: layer1-code-audit.json
          if-no-files-found: ignore

      - name: Upload UCOS architecture dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucos-architecture-audit
          path: ucos-architecture-audit.json
          if-no-files-found: ignore
