name: 🧪 CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: 🔍 Lint (Ruff)
        run: ruff check layers/ --select E,F,W --ignore E501,E402,E741,E731,E721,F841

      - name: 🧪 Unit Tests + Integration Tests (with Coverage)
        run: |
          python -m pytest layers/layer01_core/tests/ \
            -v \
            --tb=short \
            --cov=layers/layer01_core \
            --cov-report=term-missing \
            --cov-report=html:coverage_html \
            --cov-fail-under=80

      - name: 📊 Coverage Summary
        run: |
          echo "=== COVERAGE REPORT ==="
          python -m pytest layers/layer01_core/tests/ \
            --cov=layers/layer01_core \
            --cov-report=term-missing \
            --no-header -q 2>&1 | tail -30

      - name: 📤 Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 7
