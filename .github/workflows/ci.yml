name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ucos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: ${{ github.workspace }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: aios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install --break-system-packages --upgrade pip
          pip install --break-system-packages -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Layer 1 Static Code Audit
        run: |
          python tools/layer1_code_audit.py --json layer1-code-audit.json

      - name: Upload Layer 1 Audit
        uses: actions/upload-artifact@v4
        with:
          name: layer1-code-audit
          path: layer1-code-audit.json

      - name: Layer 1 Secret Pattern Scan
        shell: bash
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' -- layers/layer01_core docs/architecture tests; then
            echo "Potential high-confidence secret material found in Layer 1 source/docs."
            exit 1
          fi

      - name: Run Layer 11 Production Gate
        run: |
          python -m pytest tests/test_layer11_async_runtime.py -q --tb=short
          ruff check layers/layer11_async_runtime tests/test_layer11_async_runtime.py --select E,F,W --ignore E501,E402

      - name: Run Layer 10 Production Gate
        run: |
          python -m pytest tests/layer10_monetization/test_business_intelligence.py tests/layer10_monetization/test_universal_os.py tests/test_layer10_production_gate.py -q --tb=short
          ruff check layers/layer10_monetization tests/layer10_monetization tests/test_layer10_production_gate.py --select E,F,W --ignore E501,E402

      - name: Run Layer 15 Production Gate
        run: |
          python -m pytest tests/test_layer15_production_gate.py -q --tb=short
          ruff check layers/layer15_async_runtime tests/test_layer15_production_gate.py --select E,F,W --ignore E501,E402

      - name: Run Integration Contract Tests
        run: python -m pytest tests/test_real_integration_contracts.py -q --tb=short
      - name: Run Layer 4 Production Gate Tests
        run: python -m pytest tests/layer04_writing/test_production_hardening.py tests/layer04_writing/test_modules_3_10.py -q --tb=short

      - name: Run Layer 5 Production Gate Tests
        run: |
          python -m pytest tests/unit/layer05_image -q --tb=short
          ruff check layers/layer05_image tests/unit/layer05_image --select E,F,W --ignore E501,E402

      - name: Run Layer 5 Real Gemini Smoke Test
        if: env.GEMINI_API_KEY != '' && env.OPENROUTER_API_KEY == ''
        env:
          UCOS_IMAGE_OUTPUT_DIR: ${{ runner.temp }}/ucos-layer5-images
        run: |
          python - <<'PY'
          from pathlib import Path
          from layers.layer05_image.modules.image_provider.gemini_image_provider import GeminiImageProvider

          provider = GeminiImageProvider(model="gemini-3.1-flash-image")
          if not provider.is_configured():
              raise SystemExit("Gemini smoke test: provider is not configured")
          result = provider.generate(
              "Create a simple professional abstract blue geometric marketing background",
              size="512x512",
          )
          if not result.image_data:
              raise SystemExit("Gemini smoke test: empty image data")
          digest = result.metadata.get("sha256")
          if not digest:
              raise SystemExit("Gemini smoke test: missing SHA-256")
          persisted = Path(result.image_url)
          if not persisted.is_file() or persisted.stat().st_size == 0:
              raise SystemExit("Gemini smoke test: persisted image is missing or empty")
          print(f"Gemini smoke PASS: bytes={len(result.image_data)} sha256={digest}")
          PY
        
      - name: Run Layer 14 Production Gate
        run: python -m pytest tests/test_layer14_production_gate.py tests/test_layer14_integration.py -q --tb=short

      - name: Run Layer 1 Production Gate Tests
        run: python -m pytest tests/test_layer1_production_gate.py tests/test_layer1_runtime.py tests/test_layer1_code_audit.py -q --tb=short

      - name: Run Layer 8 Production Gate Tests
        run: python -m pytest tests/test_layer8_production_gate.py -q --tb=short

      - name: Run Full Test Suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee full-test-output.txt

      - name: Upload Full Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-output
          path: full-test-output.txt
          if-no-files-found: ignore

      - name: System Status
        run: |
          python main.py --boot
          python main.py --integration-status
