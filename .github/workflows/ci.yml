name: 🧪 CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINIAPIKEY2: ${{ secrets.GEMINIAPIKEY2 }}
      GEMINIAPIKEY3: ${{ secrets.GEMINIAPIKEY3 }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: 🔍 Lint (Ruff) — Advisory Only
        continue-on-error: true
        run: |
          ruff check layers/ --select E,F,W \
            --ignore E501,E402,E741,E731,E721,F841,E701,E702,F401,E401,F821,F403

      - name: 🧪 Full Test Suite (All Layers + Tests)
        run: |
          python -m pytest \
            tests/ \
            --ignore=tests/test_core.py \
            layers/layer01_core/tests/ \
            layers/layer02_research/tests/ \
            layers/layer03_intelligence/tests/ \
            layers/layer04_writing/tests/ \
            layers/layer05_image/tests/ \
            layers/layer06_quality/tests/ \
            layers/layer07_publishing/tests/ \
            layers/layer08_analytics/tests/ \
            layers/layer09_learning/tests/ \
            layers/layer10_monetization/tests/ \
            -v \
            --tb=short \
            -q
