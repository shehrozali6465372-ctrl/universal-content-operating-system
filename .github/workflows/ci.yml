name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pytest tests/ layers/layer01_core/tests/ layers/layer02_research/tests/ layers/layer04_writing/tests/ layers/layer05_image/tests/ layers/layer06_quality/tests/ layers/layer07_publishing/tests/ layers/layer08_analytics/tests/ layers/layer09_learning/tests/ layers/layer10_monetization/tests/ -q --tb=short

      - name: System Status
        run: python main.py --status
