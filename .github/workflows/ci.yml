name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests (Layer 1 Core)
        run: |
          python -m pytest layers/layer01_core/tests/ -q --tb=short

      - name: Run Layer 2-10 Tests
        run: |
          python -m pytest layers/layer02_research/tests/ layers/layer03_intelligence/tests/ layers/layer04_writing/tests/ layers/layer05_image/tests/ layers/layer06_quality/tests/ layers/layer07_publishing/tests/ layers/layer08_analytics/tests/ layers/layer09_learning/tests/ layers/layer10_monetization/tests/ -q --tb=short

      - name: Run Full Test Suite
        run: |
          python -m pytest tests/ -q --tb=short --ignore=tests/test_core.py

      - name: System Status Check
        run: |
          python main.py --status
