name: UCOS Full End-to-End One Real Autonomous Post
# Production certification trigger.
# Live provider credential gate recheck.
# Production certification execution marker: run exactly once per certification revision.
# Research provider: SerpAPI when configured, Google News RSS fallback otherwise.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ucos-full-e2e-one-post.yml"
      - ".github/workflows/production-activation-gate.yml"
      - "layers/layer07_publishing/modules/platform_plugin_manager/facebook/facebook_publisher.py"
      - "layers/layer14_enterprise_integration/modules/real_integrations/gateway.py"
      - "layers/layer14_enterprise_integration/modules/master_orchestrator/pipeline_wiring.py"
      - "layers/layer14_enterprise_integration/modules/master_orchestrator/production_pipeline.py"
      - "tests/test_real_integration_contracts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_API_VERSION: v26.0
      UCOS_FACEBOOK_TARGET_PAGE_ID: "1238826765982455"
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile UCOS
        run: python -m compileall -q layers dashboard
      - name: One real post through canonical UCOS autonomous pipeline
        env:
          APP_ENV: production
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: aios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINIAPIKEY2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINIAPIKEY3 }}
          UCOS_ACCOUNT_REGISTRY_DB: ${{ runner.temp }}/ucos-e2e/accounts/registry.sqlite3
          UCOS_ACCOUNT_WORKSPACES: ${{ runner.temp }}/ucos-e2e/accounts/workspaces
          UCOS_CONTENT_HISTORY_DB: ${{ runner.temp }}/ucos-e2e/content-history.sqlite3
        run: |
          python - <<'PY'
          import json, os, time
          from layers.layer07_publishing.modules.account_control.meta_asset_discovery import MetaAssetDiscovery
          from layers.layer07_publishing.modules.account_control.account_registry import AccountRegistry
          from layers.layer14_enterprise_integration.modules.master_orchestrator.production_pipeline import ProductionPipeline, ContentRequest

          print("GEMINI_KEYS_CONFIGURED=" + json.dumps({k: bool(os.environ.get(k, "").strip()) for k in ("GEMINI_API_KEY_1","GEMINI_API_KEY_2","GEMINI_API_KEY_3")}, sort_keys=True))
          token = os.environ.get("META_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("META_ACCESS_TOKEN missing")

          discovery = MetaAssetDiscovery(token=token, api_version=os.environ["META_GRAPH_API_VERSION"])
          health = discovery.health()
          if not health.get("valid"):
              raise SystemExit(f"Meta health failed: {health}")

          registry = AccountRegistry()
          discovered = discovery.discover()
          if len(discovered["facebook"]) != 12:
              raise SystemExit(f"Expected 12 Facebook Pages, found {len(discovered['facebook'])}")
          if len(discovered["instagram"]) != 11:
              raise SystemExit(f"Expected 11 Instagram profiles, found {len(discovered['instagram'])}")

          discovery.provision(registry)
          target_page_id = os.environ.get("UCOS_FACEBOOK_TARGET_PAGE_ID", "").strip()
          if target_page_id != "1238826765982455":
              raise SystemExit("UCOS_FACEBOOK_TARGET_PAGE_ID is not configured to the requested production Page ID")
          matches = [p for p in discovered["facebook"] if str(p.asset_id) == target_page_id]
          if len(matches) != 1:
              raise SystemExit(f"Configured UCOS_FACEBOOK_TARGET_PAGE_ID was not uniquely discovered: {target_page_id}")
          page = matches[0]
          account_id = f"facebook:{page.asset_id}"
          account = registry.get(account_id)
          if account is None:
              raise SystemExit("Selected Meta Page was not provisioned into AccountRegistry")

          marker = "UCOS-AUTONOMOUS-E2E-" + str(int(time.time()))
          topic = "Practical home organization tips for a calmer, more efficient living space"
          goal = (
              f"{topic}. Create original useful content, validate it, and publish it through "
              f"the canonical UCOS pipeline. Internal verification marker: {marker}"
          )
          request = ContentRequest(
              topic=goal,
              platform="facebook",
              tone="professional and helpful",
              style="educational",
              include_image=False,
              max_length=1000,
          )
          request.metadata.update({
              "account_id": account_id,
              "credentials_ref": "META_ACCESS_TOKEN",
              "content_type": "post",
              "niche": account.niche,
              "test_marker": marker,
          })
          os.environ["FACEBOOK_PAGE_ID"] = page.asset_id
          os.environ["FACEBOOK_ACCESS_TOKEN"] = token

          pipeline = ProductionPipeline()
          data = None
          for attempt in range(1, 6):
              request.topic = (
                  f"{topic}. Write a practical Facebook post with a clear opening, "
                  "three concise actionable tips, short explanatory sentences, and a useful closing question. "
                  f"Internal verification marker: {marker}-attempt-{attempt}"
              )
              request.metadata["test_marker"] = f"{marker}-attempt-{attempt}"
              candidate = pipeline.execute(request).to_dict()
              score = float(candidate.get("quality_score") or 0.0)
              print(f"QUALITY_ATTEMPT_{attempt}=" + str(score))
              if candidate.get("published"):
                  data = candidate
                  break
              if not any(s.get("layer") == "L6-Quality" and s.get("status") == "error" for s in candidate.get("steps", [])):
                  data = candidate
                  break
          if data is None:
              raise SystemExit("UCOS could not produce a quality-gated publishable candidate after 5 attempts")
          print("META_DISCOVERY=PASS")
          print("SELECTED_FACEBOOK_PAGE_ID=" + str(page.asset_id))
          print("SELECTED_FACEBOOK_PAGE_NAME=" + str(getattr(page, "display_name", "") or ""))
          print("ACCOUNT_PROVISIONING=PASS")
          print("UCOS_PIPELINE=" + json.dumps(data, sort_keys=True))

          required = ["L2-Research","L3-Intelligence","L4-Writing","L12-AI","L5-Image","L6-Quality","L7-Publish","L8-Analytics","L9-Learning"]
          actual = [s["layer"] for s in data["steps"]]
          print("EXPECTED_CANONICAL_STEPS=" + json.dumps(required))
          print("ACTUAL_CANONICAL_STEPS=" + json.dumps(actual))
          if actual != required:
              raise SystemExit("Canonical UCOS pipeline did not execute every required stage")
          failures = [s for s in data["steps"] if s["status"] != "success" and s["layer"] != "L5-Image"]
          if failures:
              raise SystemExit("Canonical UCOS stage failure: " + json.dumps(failures, sort_keys=True))
          image_step = next(s for s in data["steps"] if s["layer"] == "L5-Image")
          if image_step["status"] not in ("success", "skipped"):
              raise SystemExit("L5-Image stage failed")
          if not data.get("published"):
              raise SystemExit("Canonical UCOS pipeline did not publish a real post")
          pid = data.get("publish_result", {}).get("post_id")
          if pid is None:
              raise SystemExit("Canonical publisher returned no real post_id")

          ai_step = next(s for s in data["steps"] if s["layer"] == "L12-AI")
          if ai_step["status"] != "success" or "offline" in ai_step.get("data_keys", []):
              raise SystemExit("AI generation was not a configured production success")

          from layers.layer07_publishing.modules.platform_plugin_manager.plugin_manager import PluginManager
          credentials = __import__(
              "layers.layer07_publishing.modules.account_control.meta_credentials",
              fromlist=["MetaCredentialProvider"],
          ).MetaCredentialProvider(token=token).credentials_for("facebook", account_id)
          plugins = PluginManager()
          plugins.authenticate("facebook", credentials)
          facebook_plugin = plugins.registry.get_instance("facebook")
          page_info = facebook_plugin.get_page_info()
          print("TARGET_PAGE_IS_PUBLISHED=" + str(page_info.get("is_published")))
          print("TARGET_PAGE_USERNAME=" + str(page_info.get("username") or ""))
          print("TARGET_PAGE_LINK=" + str(page_info.get("link") or ""))
          if page_info.get("is_published") is False:
              raise SystemExit("Facebook target Page itself is unpublished")
          verified = facebook_plugin.get_post(str(pid))
          if not verified or str(verified.get("id")) != str(pid):
              raise SystemExit("Real Facebook post verification failed")
          post_from = verified.get("from") or {}
          verified_page_id = str(post_from.get("id") or "").strip()
          verified_page_name = str(post_from.get("name") or "").strip()
          if verified_page_id != str(page.asset_id):
              raise SystemExit("Facebook post owner mismatch: published page ID does not match verified post owner")
          if verified.get("is_hidden") is True:
              raise SystemExit("Facebook post verification failed: post is hidden")
          if verified.get("is_published") is False:
              raise SystemExit("Facebook post verification failed: post is not published")
          graph_permalink = str(verified.get("permalink_url") or "").strip()
          publish_url = str(data.get("publish_result", {}).get("url") or "").strip()
          post_id_tail = str(pid).split("_")[-1]
          page_public_path = str(page_info.get("username") or "").strip() or str(page.asset_id)
          expected_page_url = f"https://www.facebook.com/{page_public_path}/posts/{post_id_tail}"
          if publish_url != expected_page_url:
              raise SystemExit(
                  "Facebook publish URL mismatch: publisher must return the target Page-scoped URL "
                  f"{expected_page_url}, got {publish_url}"
              )
          if not graph_permalink:
              raise SystemExit("Facebook post verification failed: Graph API returned no permalink_url")

          # Public-surface verification: verify the exact Page-scoped URL emitted by
          # the publisher, not only Meta's actor-scoped permalink_url.
          import urllib.request
          public_req = urllib.request.Request(
              publish_url,
              headers={"User-Agent": "Mozilla/5.0 (compatible; UCOS-Public-Post-Verifier/1.0)"},
          )
          try:
              with urllib.request.urlopen(public_req, timeout=20) as public_resp:
                  public_html = public_resp.read(2_000_000).decode("utf-8", errors="ignore")
                  public_final_url = str(public_resp.geturl() or "")
                  public_status = int(public_resp.status)
          except Exception as exc:
              raise SystemExit(f"Facebook public post verification failed: {type(exc).__name__}: {exc}")
          print("PUBLIC_POST_HTTP_STATUS=" + str(public_status))
          print("PUBLIC_POST_REQUEST_URL=" + publish_url)
          print("PUBLIC_POST_FINAL_URL=" + public_final_url)
          if public_status != 200:
              raise SystemExit("Facebook public post verification failed: Page-scoped permalink did not return HTTP 200")
          if post_id_tail not in public_html and str(pid) not in public_html:
              raise SystemExit("Facebook public post verification failed: exact post ID is absent from Page-scoped permalink HTML")
          public_message = str(verified.get("message") or "").strip()
          message_probe = public_message[:80]
          if message_probe and message_probe not in public_html:
              raise SystemExit("Facebook public post verification failed: published post message is absent from public HTML")
          print("PUBLIC_POST_HTML_ID_MATCH=PASS")
          print("PUBLIC_POST_HTML_MESSAGE_MATCH=" + ("PASS" if message_probe else "SKIP"))

          page_feed = facebook_plugin.get_page_feed(limit=100)
          feed_matches = [p for p in page_feed if str(p.get("id") or "") == str(pid)]
          if len(feed_matches) != 1:
              raise SystemExit("Facebook post verification failed: post was not returned by the target Page /feed")
          feed_post = feed_matches[0]
          if feed_post.get("is_hidden") is True or feed_post.get("is_published") is False:
              raise SystemExit("Facebook post verification failed: Page /feed marks the post hidden or unpublished")
          print("TARGET_PAGE_FEED_POST=PASS")

          print("REAL_FACEBOOK_POST_ID=" + str(pid))
          print("VERIFIED_FACEBOOK_POST_OWNER_ID=" + verified_page_id)
          print("VERIFIED_FACEBOOK_POST_OWNER_NAME=" + verified_page_name)
          print("VERIFIED_FACEBOOK_POST_IS_HIDDEN=" + str(verified.get("is_hidden")))
          print("VERIFIED_FACEBOOK_POST_IS_PUBLISHED=" + str(verified.get("is_published")))
          print("VERIFIED_FACEBOOK_POST_GRAPH_PERMALINK=" + graph_permalink)
          print("VERIFIED_FACEBOOK_POST_PAGE_PERMALINK=" + publish_url)
          print("REAL_FACEBOOK_POST_VERIFICATION=PASS")
          print("RESEARCH_PROVIDER=" + str(data["metadata"].get("research_provider") or ""))
          print("ANALYTICS_STAGE=PASS")
          print("LEARNING_STAGE=PASS")
          print("FINAL_RESULT=PASS_FULL_UCOS_AUTONOMOUS_ONE_REAL_POST")
          PY
