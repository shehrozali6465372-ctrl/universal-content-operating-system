name: Pinterest OAuth Token Refresh

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinterest-oauth-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh expiring Pinterest credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      UCOS_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.UCOS_CREDENTIAL_ENCRYPTION_KEY }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate refresh script syntax
        run: python -m py_compile scripts/refresh_pinterest_tokens.py
      - name: Refresh due credentials
        run: python scripts/refresh_pinterest_tokens.py
