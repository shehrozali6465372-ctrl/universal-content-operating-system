name: UCOS Free-Tier Keepalive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ucos-keepalive.yml"
  schedule:
    # Check every ten minutes to prevent Render Free's 15-minute idle spin-down.
    # Offset from the hour to reduce GitHub schedule contention.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ucos-free-tier-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake and verify UCOS health endpoint
        shell: bash
        run: |
          set -uo pipefail
          url="https://ucos-backend.onrender.com/healthz"
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --output /tmp/ucos-health.json --write-out '%{http_code}' --max-time 45 "$url" || true)"
            if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/ucos-health.json; then
              echo "UCOS health check passed (HTTP 200)."
              cat /tmp/ucos-health.json
              break
            fi
            echo "UCOS health check attempt $attempt failed (HTTP ${status:-no-response})."
            cat /tmp/ucos-health.json 2>/dev/null || true
            if [ "$attempt" = "3" ]; then
              echo "UCOS did not become healthy after three attempts." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify Modern Living Hub backend configuration once on workflow updates
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -uo pipefail
          url="https://modern-living-hub.onrender.com/api/health"
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --output /tmp/mlh-health.json --write-out '%{http_code}' --max-time 45 "$url" || true)"
            if [ "$status" = "200" ] && jq -e '
              .status == "ok" and
              .pinterest_client_id_configured == true and
              .redirect_uri_configured == true and
              .frontend_url_configured == true and
              .ucos_vault_configured == true and
              .production_mode == true
            ' /tmp/mlh-health.json >/dev/null; then
              echo "Modern Living Hub backend is healthy and required integration variables are present:"
              jq '{status, service, pinterest_client_id_configured, redirect_uri_configured, frontend_url_configured, ucos_vault_configured, production_mode, sandbox_mode}' /tmp/mlh-health.json
              exit 0
            fi
            echo "Modern Living Hub health/config check attempt $attempt failed (HTTP ${status:-no-response})."
            jq '{status, service, pinterest_client_id_configured, redirect_uri_configured, frontend_url_configured, ucos_vault_configured, production_mode, sandbox_mode}' /tmp/mlh-health.json 2>/dev/null || true
            if [ "$attempt" = "3" ]; then
              echo "Modern Living Hub backend or required integration configuration is not ready." >&2
              exit 1
            fi
            sleep 5
          done
