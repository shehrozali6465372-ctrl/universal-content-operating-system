name: Layer 10 Production Certification

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r requirements.txt
      - name: DeepSeek credential smoke
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          code="$(curl -sS -o /tmp/deepseek.json -w '%{http_code}' https://api.deepseek.com/chat/completions -H 'Content-Type: application/json' -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly: UCOS_DEEPSEEK_OK"}],"max_tokens":8,"stream":false}')"
          test "$code" = "200"
      - name: Layer 10 production tests
        run: python -m pytest tests/layer10_monetization tests/test_layer10_production_gate.py -q --tb=short
      - name: Layer 10 lint
        run: ruff check layers/layer10_monetization --select E,F,W --ignore E501,E402,E741,E701,E702
