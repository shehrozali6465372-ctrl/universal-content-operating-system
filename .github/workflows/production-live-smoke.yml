name: UCOS Live Production Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-live-smoke.yml"
      - "main.py"
      - "layers/layer14_enterprise_integration/modules/api_gateway/api_gateway.py"
      - "services/ucos_browser/server.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify public browser worker
        run: |
          set -euo pipefail
          for i in {1..6}; do
            code="$(curl -sS -o /tmp/browser-root.json -w '%{http_code}' https://ucos-personal-browser.onrender.com/ || true)"
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/browser-root.json; then
              echo "BROWSER_PUBLIC_ROOT=PASS"
              break
            fi
            [ "$i" -eq 6 ] && { cat /tmp/browser-root.json || true; echo "BROWSER_PUBLIC_ROOT=FAIL"; exit 1; }
            sleep 10
          done

      - name: Verify public UCOS API health probe
        run: |
          set -euo pipefail
          for i in {1..6}; do
            code="$(curl -sS -o /tmp/ucos-healthz.json -w '%{http_code}' https://ucos-backend.onrender.com/healthz || true)"
            if [ "$code" = "200" ] && grep -q '"success": true' /tmp/ucos-healthz.json && grep -q '"status": "ok"' /tmp/ucos-healthz.json; then
              cat /tmp/ucos-healthz.json
              echo "UCOS_API_HEALTHZ=PASS"
              break
            fi
            [ "$i" -eq 6 ] && { cat /tmp/ucos-healthz.json || true; echo "UCOS_API_HEALTHZ=FAIL"; exit 1; }
            sleep 10
          done

      - name: Verify API authentication remains fail-closed
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/ucos-auth.json -w '%{http_code}' https://ucos-backend.onrender.com/health || true)"
          test "$code" = "401"
          grep -q "API authentication required" /tmp/ucos-auth.json
          echo "UCOS_API_AUTH_FAIL_CLOSED=PASS"

      - name: Production smoke result
        run: echo "FINAL_LIVE_SMOKE=PASS"
