name: Layer 14 Production Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer14-production-certification
  cancel-in-progress: false

jobs:
  layer14:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Layer 14
        run: |
          python -m compileall -q layers/layer14_enterprise_integration

      - name: Import Layer 14 Core
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path
          root = Path("layers/layer14_enterprise_integration/modules")
          modules = []
          for p in root.rglob("*.py"):
              if p.name == "__init__.py":
                  continue
              rel = p.relative_to(Path(".")).with_suffix("")
              modules.append(".".join(rel.parts))
          failures = []
          for name in sorted(modules):
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append(f"{name}: {type(exc).__name__}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Imported {len(modules)} Layer 14 modules successfully")
          PY

      - name: DeepSeek API credential smoke test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_TEST=FAIL key_missing"
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="\$(curl -sS -o "$response_file" -w '%{http_code}' \
            https://api.deepseek.com/chat/completions \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly: UCOS_DEEPSEEK_OK"}],"max_tokens":8,"stream":false}')"
          if [ "$status" != "200" ]; then
            echo "DEEPSEEK_API_TEST=FAIL http_status=$status"
            python - "$response_file" <<'PY'
import json, sys
try:
    data=json.load(open(sys.argv[1], encoding="utf-8"))
    err=data.get("error", {})
    print("provider_error_type=" + str(err.get("type", "unknown")))
    print("provider_error_code=" + str(err.get("code", "unknown")))
except Exception:
    print("provider_error_body=unparseable")
PY
            exit 1
          fi
          python - "$response_file" <<'PY'
import json, sys
data=json.load(open(sys.argv[1], encoding="utf-8"))
content=(data.get("choices") or [{}])[0].get("message", {}).get("content", "").strip()
if not content:
    raise SystemExit("DEEPSEEK_API_TEST=FAIL empty_response")
print("DEEPSEEK_API_TEST=PASS")
print("DEEPSEEK_MODEL=" + str(data.get("model", "unknown")))
print("DEEPSEEK_RESPONSE_NONEMPTY=true")
PY

      - name: Layer 14 Production Gate
        run: |
          python -m pytest tests/test_layer14_production_gate.py tests/test_layer14_integration.py -q --tb=short

      - name: Layer 14 Security Regression
        run: |
          python -m pytest tests/test_layer14_production_gate.py -q --tb=short
