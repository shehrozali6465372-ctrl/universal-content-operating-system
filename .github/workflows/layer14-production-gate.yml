name: Layer 14 Production Certification

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  layer14:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: production
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r requirements.txt
      - name: Compile Layer 14
        run: python -m compileall -q layers/layer14_enterprise_integration
      - name: Import Layer 14 modules
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path
          failures=[]
          for p in Path("layers/layer14_enterprise_integration/modules").rglob("*.py"):
              if p.name == "__init__.py":
                  continue
              name=".".join(p.with_suffix("").parts)
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append(f"{name}: {type(exc).__name__}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("LAYER14_IMPORT=PASS")
          PY
      - name: DeepSeek credential smoke
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          code="$(curl -sS -o /tmp/deepseek.json -w '%{http_code}' https://api.deepseek.com/chat/completions -H 'Content-Type: application/json' -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly: UCOS_DEEPSEEK_OK"}],"max_tokens":8,"stream":false}')"
          test "$code" = "200"
      - name: Layer 14 production gate
        run: python -m pytest tests/test_layer14_production_gate.py tests/test_layer14_integration.py -q --tb=short
