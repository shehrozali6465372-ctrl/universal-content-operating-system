name: Layer 5 Production Gate
# Layer 5 certification gate: real-provider, persistence, provenance, and failure-path verification.

on:
  push:
    branches: [main]
    paths:
      - "layers/layer05_image/**"
      - "tests/unit/layer05_image/**"
      - "scripts/puter_image_provider.cjs"
      - "layers/layer14_enterprise_integration/modules/master_orchestrator/pipeline_wiring.py"
      - "package.json"
      - ".github/workflows/layer05-production-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer05-production-gate
  cancel-in-progress: false

jobs:
  layer05:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 || secrets.GEMINIAPIKEY2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 || secrets.GEMINIAPIKEY3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_IMAGE_MODEL: ${{ secrets.CLOUDFLARE_IMAGE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          pip install --break-system-packages --upgrade pip
          pip install --break-system-packages -r requirements.txt
          npm install --ignore-scripts --no-audit --no-fund

      - name: Compile Layer 5
        run: python -m compileall -q layers/layer05_image

      - name: Validate Puter bridge syntax
        run: node --check scripts/puter_image_provider.cjs

      - name: Layer 5 unit, comprehensive, and contract tests
        run: |
          python -m pytest tests/unit/layer05_image tests/layer05_image -q --tb=short


      - name: Require at least one real Layer 5 provider
        run: |
          if { [ -n "$CLOUDFLARE_API_TOKEN" ] || [ -n "$CF_API_TOKEN" ]; } && { [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || [ -n "$CF_ACCOUNT_ID" ]; }; then
            echo "LAYER5_PROVIDER=cloudflare"
          elif [ -n "$PUTER_AUTH_TOKEN" ]; then
            echo "LAYER5_PROVIDER=puter"
          else
            echo "No real Layer 5 provider credential configured"
            exit 1
          fi

      - name: Real Layer 5 image-provider smoke
        env:
          UCOS_IMAGE_OUTPUT_DIR: ${{ runner.temp }}/ucos-layer5-images
        run: |
          python -c 'import os; from hashlib import sha256; from pathlib import Path; from layers.layer05_image.modules.image_provider.cloudflare_image_provider import CloudflareImageProvider; from layers.layer05_image.modules.image_provider.puter_image_provider import PuterImageProvider; p=CloudflareImageProvider() if (os.environ.get("CLOUDFLARE_API_TOKEN") or os.environ.get("CF_API_TOKEN")) and (os.environ.get("CLOUDFLARE_ACCOUNT_ID") or os.environ.get("CF_ACCOUNT_ID")) else PuterImageProvider(); r=p.generate("Create a simple professional abstract geometric marketing background", size="512x512"); assert r.image_data and r.metadata.get("sha256")==sha256(r.image_data).hexdigest(); q=Path(r.image_url); assert q.is_file() and q.read_bytes()==r.image_data; print("REAL_LAYER5_SMOKE_PASS provider="+r.provider+" bytes="+str(len(r.image_data)))'
