name: Layer 5 Production Gate
# Layer 5 certification gate: real-provider, persistence, provenance, and failure-path verification.

on:
  push:
    branches: [main]
    paths:
      - "layers/layer05_image/**"
      - "tests/unit/layer05_image/**"
      - ".github/workflows/layer05-production-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer05-production-gate
  cancel-in-progress: false

jobs:
  layer05:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 || secrets.GEMINIAPIKEY2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 || secrets.GEMINIAPIKEY3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --break-system-packages --upgrade pip
          pip install --break-system-packages -r requirements.txt

      - name: Compile Layer 5
        run: python -m compileall -q layers/layer05_image

      - name: Layer 5 unit and contract tests
        run: python -m pytest tests/unit/layer05_image -q --tb=short


      - name: Real image-provider smoke (Gemini, then OpenRouter fallback)
        env:
          UCOS_IMAGE_OUTPUT_DIR: ${{ runner.temp }}/ucos-layer5-images
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          from layers.layer05_image.modules.image_provider.gemini_image_provider import GeminiImageProvider
          from layers.layer05_image.modules.image_provider.openrouter_image_provider import OpenRouterImageProvider

          prompt = "Create a simple professional abstract geometric marketing background"
          errors = []
          providers = []
          if os.environ.get("GEMINI_API_KEY"):
              providers.append(("gemini", GeminiImageProvider(model="gemini-3.1-flash-image")))
          if os.environ.get("OPENROUTER_API_KEY"):
              providers.append(("openrouter", OpenRouterImageProvider(model="bytedance-seed/seedream-4.5")))
          if not providers:
              raise SystemExit("No real Layer 5 image provider credential is configured")

          for name, provider in providers:
              try:
                  if not provider.is_configured():
                      errors.append(f"{name}: provider is not configured")
                      continue
                  result = provider.generate(prompt, size="512x512")
                  if not result.image_data:
                      raise RuntimeError("returned empty image bytes")
                  digest = result.metadata.get("sha256")
                  if not digest:
                      raise RuntimeError("missing SHA-256 provenance")
                  path = Path(result.image_url)
                  if not path.is_file() or path.stat().st_size == 0:
                      raise RuntimeError("persisted image is missing or empty")
                  print(f"REAL_{name.upper()}_SMOKE_PASS bytes={len(result.image_data)} sha256={digest}")
                  raise SystemExit(0)
              except Exception as exc:
                  errors.append(f"{name}: {type(exc).__name__}: {exc}")

          raise SystemExit("All configured real image providers failed: " + " | ".join(errors))
          PY
