name: Layer 5 Production Gate
# Layer 5 certification gate: real-provider, persistence, provenance, and failure-path verification.

on:
  push:
    branches: [main]
    paths:
      - "layers/layer05_image/**"
      - "tests/unit/layer05_image/**"
      - "scripts/puter_image_provider.cjs"
      - "package.json"
      - ".github/workflows/layer05-production-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer05-production-gate
  cancel-in-progress: false

jobs:
  layer05:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 || secrets.GEMINIAPIKEY2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 || secrets.GEMINIAPIKEY3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install --break-system-packages --upgrade pip
          pip install --break-system-packages -r requirements.txt
          npm install --ignore-scripts --no-audit --no-fund

      - name: Compile Layer 5
        run: python -m compileall -q layers/layer05_image

      - name: Layer 5 unit and contract tests
        run: python -m pytest tests/unit/layer05_image -q --tb=short


      - name: Require Puter production credential
        run: |
          test -n "$PUTER_AUTH_TOKEN"

      - name: Real Puter image-provider smoke
        env:
          UCOS_IMAGE_OUTPUT_DIR: ${{ runner.temp }}/ucos-layer5-images
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          from layers.layer05_image.modules.image_provider.puter_image_provider import PuterImageProvider

          prompt = "Create a simple professional abstract geometric marketing background"
          provider = PuterImageProvider()
          if not provider.is_configured():
              raise SystemExit("Puter provider is not configured")

          result = provider.generate(prompt, size="512x512")
          if not result.image_data:
              raise SystemExit("Puter returned empty image bytes")
          digest = sha256(result.image_data).hexdigest()
          if result.metadata.get("sha256") != digest:
              raise SystemExit("Puter SHA-256 provenance mismatch")
          path = Path(result.image_url)
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Persisted Puter image is missing or empty")
          if path.read_bytes() != result.image_data:
              raise SystemExit("Persisted Puter bytes differ from returned bytes")
          print(f"REAL_PUTER_SMOKE_PASS bytes={len(result.image_data)} sha256={digest} path={path}")
          PY
