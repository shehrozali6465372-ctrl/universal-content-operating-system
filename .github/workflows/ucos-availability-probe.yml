name: UCOS Free-tier availability probe

on:
  schedule:
    # Stagger away from minute 0; the keepalive workflow uses the alternate
    # ten-minute offsets so the two jobs make a best-effort probe every 5 min.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ucos-free-tier-availability-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check UCOS health endpoint
        env:
          UCOS_HEALTH_URL: https://ucos-backend.onrender.com/healthz
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ["UCOS_HEALTH_URL"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "UCOS-availability-probe/1.0", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  body = response.read(4096).decode("utf-8", "replace")
                  try:
                      payload = json.loads(body)
                  except ValueError:
                      print(f"UCOS health returned invalid JSON (HTTP {response.status}).", file=sys.stderr)
                      sys.exit(1)
                  logical_status = payload.get("data", {}).get("status")
                  print(f"UCOS health status={response.status}; logical_status={logical_status}")
                  if response.status != 200 or payload.get("success") is not True or logical_status != "ok":
                      print("UCOS health payload did not satisfy the readiness contract.", file=sys.stderr)
                      sys.exit(1)
          except (urllib.error.URLError, TimeoutError) as exc:
              print(f"UCOS health check failed: {type(exc).__name__}: {exc}", file=sys.stderr)
              sys.exit(1)
          PY
