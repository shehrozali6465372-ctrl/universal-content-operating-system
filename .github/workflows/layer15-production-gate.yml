name: Layer 15 Production Gate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "layers/layer15_async_runtime/**"
      - "tests/test_layer15_production_gate.py"
      - ".github/workflows/layer15-production-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each certification run must finish against its exact commit; never cancel a run because another layer changed main.
  group: layer15-production-gate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  layer15:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: |
          pip install --break-system-packages --upgrade pip
          pip install --break-system-packages -r requirements.txt
      - name: Compile Layer 15
        run: python -m compileall -q layers/layer15_async_runtime tests/test_layer15_production_gate.py
      - name: Layer 15 Production Tests
        run: python -m pytest tests/test_layer15_production_gate.py -q --tb=short
      - name: DeepSeek API credential smoke test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_TEST=FAIL key_missing"
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="\$(curl -sS -o "$response_file" -w '%{http_code}' \
            https://api.deepseek.com/chat/completions \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly: UCOS_DEEPSEEK_OK"}],"max_tokens":8,"stream":false}')"
          if [ "$status" != "200" ]; then
            echo "DEEPSEEK_API_TEST=FAIL http_status=$status"
            python - "$response_file" <<'PY'
import json, sys
try:
    data=json.load(open(sys.argv[1], encoding="utf-8"))
    err=data.get("error", {})
    print("provider_error_type=" + str(err.get("type", "unknown")))
    print("provider_error_code=" + str(err.get("code", "unknown")))
except Exception:
    print("provider_error_body=unparseable")
PY
            exit 1
          fi
          python - "$response_file" <<'PY'
import json, sys
data=json.load(open(sys.argv[1], encoding="utf-8"))
content=(data.get("choices") or [{}])[0].get("message", {}).get("content", "").strip()
if not content:
    raise SystemExit("DEEPSEEK_API_TEST=FAIL empty_response")
print("DEEPSEEK_API_TEST=PASS")
print("DEEPSEEK_MODEL=" + str(data.get("model", "unknown")))
print("DEEPSEEK_RESPONSE_NONEMPTY=true")
PY

      - name: Layer 15 Ruff
        run: ruff check layers/layer15_async_runtime tests/test_layer15_production_gate.py --select E,F,W --ignore E501,E402
