name: Layer 9 Production Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "layers/layer09_learning/**"
      - "tests/layer09_learning/**"
      - "tests/test_production_architecture_contracts.py"
      - ".github/workflows/layer9-production-gate.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer9:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Layer 9
        run: python -m compileall -q layers/layer09_learning tests/layer09_learning tests/test_production_architecture_contracts.py

      - name: Layer 9 unit and integration tests
        run: python -m pytest tests/layer09_learning -q --tb=short

      - name: Layer 9 production contract tests
        run: python -m pytest tests/layer09_learning/test_production_learning_contracts.py tests/test_production_architecture_contracts.py -q --tb=short
