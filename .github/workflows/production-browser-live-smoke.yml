name: UCOS Live Browser Gateway Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-browser-live-smoke.yml"
      - "layers/layer14_enterprise_integration/modules/api_gateway/api_gateway.py"
      - "services/ucos_browser/server.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gateway:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify browser worker public health
        run: |
          set -euo pipefail
          for i in {1..6}; do
            code="$(curl -sS -o /tmp/browser-root.json -w '%{http_code}' https://ucos-personal-browser.onrender.com/ || true)"
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/browser-root.json; then
              cat /tmp/browser-root.json
              echo "BROWSER_WORKER_PUBLIC=PASS"
              break
            fi
            [ "$i" -eq 6 ] && { cat /tmp/browser-root.json || true; exit 1; }
            sleep 10
          done

      - name: Verify protected browser gateway fail-closed
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/browser-unauth.json -w '%{http_code}'             -X POST             -H "Content-Type: application/json"             --data '{"url":"https://example.com","actions":[{"type":"extract"}]}'             https://ucos-backend.onrender.com/browser/tasks || true)"
          cat /tmp/browser-unauth.json
          test "$code" = "401"
          grep -q 'API authentication required' /tmp/browser-unauth.json
          echo "BROWSER_GATEWAY_AUTH_FAIL_CLOSED=PASS"

      - name: Verify browser gateway health requires authentication
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/browser-gateway-health.json -w '%{http_code}'             https://ucos-backend.onrender.com/browser/health || true)"
          cat /tmp/browser-gateway-health.json
          test "$code" = "401"
          grep -q 'API authentication required' /tmp/browser-gateway-health.json
          echo "BROWSER_GATEWAY_HEALTH_AUTH=PASS"

      - name: Final browser gateway result
        run: echo "FINAL_BROWSER_GATEWAY_SMOKE=PASS"
