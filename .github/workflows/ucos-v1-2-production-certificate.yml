name: UCOS v1.2 Production Certificate Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ucos-v1-2-production-certificate
  cancel-in-progress: false

jobs:
  architecture-and-production-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: aios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -r requirements.txt

      - name: Compile architecture
        run: python -m compileall -q layers tests tools main.py

      - name: Layer 1 security and runtime gates
        run: |
          python -m pytest tests/test_layer1_production_gate.py tests/test_layer1_runtime.py tests/test_layer1_code_audit.py -q --tb=short
          python tools/layer1_code_audit.py --json layer1-code-audit.json

      - name: Layer 5 image gates
        run: python -m pytest tests/unit/layer05_image -q --tb=short

      - name: Layer 10 monetization gates
        run: python -m pytest tests/layer10_monetization tests/test_layer10_production_gate.py -q --tb=short

      - name: Layer 13 real PostgreSQL gate
        run: python -m pytest tests/layer13_persistence/test_layer13_postgresql_real_production.py -q --tb=short

      - name: Layer 14 control-plane gates
        run: python -m pytest tests/test_layer14_production_gate.py tests/test_layer14_integration.py -q --tb=short

      - name: Layer 15 async-runtime gates
        run: python -m pytest tests/test_layer15_production_gate.py -q --tb=short

      - name: Integration contracts
        run: python -m pytest tests/test_real_integration_contracts.py -q --tb=short

      - name: Full test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee full-test-output.txt

      - name: DeepSeek real-provider smoke
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl -sS -o "$body" -w '%{http_code}' https://api.deepseek.com/chat/completions             -H 'Content-Type: application/json'             -H "Authorization: Bearer ${DEEPSEEK_API_KEY}"             --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly: UCOS_DEEPSEEK_OK"}],"max_tokens":8,"stream":false}')"
          test "$status" = "200"
          python - "$body" <<'PY'
import json, sys
data=json.load(open(sys.argv[1], encoding="utf-8"))
content=(data.get("choices") or [{}])[0].get("message", {}).get("content", "").strip()
if not content:
    raise SystemExit("empty provider response")
print("DEEPSEEK_REAL_SMOKE=PASS")
PY

      - name: System boot and integration status
        run: |
          python main.py --boot
          python main.py --integration-status

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucos-v1-2-certification-evidence
          path: |
            layer1-code-audit.json
            full-test-output.txt
          if-no-files-found: ignore
