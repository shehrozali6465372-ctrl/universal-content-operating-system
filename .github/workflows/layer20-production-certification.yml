name: Layer 20 Production Certification

on:
  push:
    branches:
      - main
      - layer20-production-certification
    paths:
      - "layers/layer20_image_pipeline/**"
      - "tests/layer20_image_pipeline/**"
      - ".github/workflows/layer20-production-certification.yml"
  pull_request:
    branches:
      - main
    paths:
      - "layers/layer20_image_pipeline/**"
      - "tests/layer20_image_pipeline/**"
      - ".github/workflows/layer20-production-certification.yml"

permissions:
  contents: read

concurrency:
  group: layer20-production-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Layer 20 production gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Layer 20
        run: python -m compileall -q layers/layer20_image_pipeline tests/layer20_image_pipeline

      - name: Layer 20 lint gate
        run: |
          ruff check layers/layer20_image_pipeline tests/layer20_image_pipeline --select E,F,W --ignore E501,E402

      - name: Layer 20 production tests
        run: |
          python -m pytest tests/layer20_image_pipeline/test_production_certification.py -q --tb=short

      - name: Layer 20 import smoke test
        run: |
          python - <<'PY'
          from layers.layer20_image_pipeline import (
              BatchGenerator,
              CompositionEngine,
              PromptBuilder,
              ProviderRouter,
              StyleEngine,
          )
          assert all((BatchGenerator, CompositionEngine, PromptBuilder, ProviderRouter, StyleEngine))
          print("Layer 20 import smoke PASS")
          PY
