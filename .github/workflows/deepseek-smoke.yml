name: DeepSeek Credential Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deepseek:
    runs-on: ubuntu-22.04
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Diagnostic
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_SECRET_INJECTED=true"
          else
            echo "DEEPSEEK_SECRET_INJECTED=false"
          fi
