name: DeepSeek Credential Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deepseek:
    runs-on: ubuntu-22.04
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Test DeepSeek API credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_TEST=FAIL key_missing"
            exit 1
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl -sS -o "$response_file" -w '%{http_code}' https://api.deepseek.com/chat/completions -H 'Content-Type: application/json' -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" --data '{"model":"deepseek-flash","messages":[{"role":"user","content":"Reply with exactly: UCOS_DEEPSEEK_OK"}],"max_tokens":8,"stream":false}')"
          echo "DEEPSEEK_HTTP_STATUS=$status"
          if [ "$status" != "200" ]; then
            echo "DEEPSEEK_API_TEST=FAIL"
            head -c 500 "$response_file" | tr '\n' ' '
            echo
            exit 1
          fi
          if grep -q '"choices"' "$response_file"; then
            echo "DEEPSEEK_API_TEST=PASS"
            echo "DEEPSEEK_RESPONSE_NONEMPTY=true"
          else
            echo "DEEPSEEK_API_TEST=FAIL empty_response"
            exit 1
          fi