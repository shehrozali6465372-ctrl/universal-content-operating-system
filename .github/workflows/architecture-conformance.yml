name: UCOS Cross-Layer Architecture Conformance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-conformance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ucos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ucos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ucos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile complete repository
        run: python -m compileall -q layers/layer07_publishing layers/layer11_async_runtime layers/layer13_persistence layers/layer14_enterprise_integration layers/layer15_async_runtime tests/test_cross_layer_architecture_conformance.py tests/test_production_architecture_contracts.py
      - name: L01 L11 boundary
        run: python scripts/check_l11_boundary.py layer01
      - name: L02 L11 boundary
        run: python scripts/check_l11_boundary.py layer02
      - name: L03 L11 boundary
        run: python scripts/check_l11_boundary.py layer03
      - name: L04 L11 boundary
        run: python scripts/check_l11_boundary.py layer04
      - name: L05 L11 boundary
        run: python scripts/check_l11_boundary.py layer05
      - name: L06 L11 boundary
        run: python scripts/check_l11_boundary.py layer06
      - name: L07 L11 boundary
        run: python scripts/check_l11_boundary.py layer07
      - name: L08 L11 boundary
        run: python scripts/check_l11_boundary.py layer08
      - name: L09 L11 boundary
        run: python scripts/check_l11_boundary.py layer09
      - name: L10 L11 boundary
        run: python scripts/check_l11_boundary.py layer10
      - name: L11 L11 boundary
        run: python scripts/check_l11_boundary.py layer11
      - name: L12 L11 boundary
        run: python scripts/check_l11_boundary.py layer12
      - name: L13 L11 boundary
        run: python scripts/check_l11_boundary.py layer13
      - name: L14 L11 boundary
        run: python scripts/check_l11_boundary.py layer14
      - name: L15 L11 boundary
        run: python scripts/check_l11_boundary.py layer15
      - name: L16 L11 boundary
        run: python scripts/check_l11_boundary.py layer16
      - name: L17 L11 boundary
        run: python scripts/check_l11_boundary.py layer17
      - name: L18 L11 boundary
        run: python scripts/check_l11_boundary.py layer18
      - name: L19 L11 boundary
        run: python scripts/check_l11_boundary.py layer19
      - name: L20 L11 boundary
        run: python scripts/check_l11_boundary.py layer20
      - name: L21 L11 boundary
        run: python scripts/check_l11_boundary.py layer21
      - name: L22 L11 boundary
        run: python scripts/check_l11_boundary.py layer22
      - name: L23 L11 boundary
        run: python scripts/check_l11_boundary.py layer23
      - name: Contract 2
        run: pytest -q tests/test_cross_layer_architecture_conformance.py::test_production_durable_execution_has_one_owner
      - name: Contract 3
        run: pytest -q tests/test_cross_layer_architecture_conformance.py::test_l13_schema_uses_one_canonical_partial_dedupe_index
      - name: Contract 4
        run: pytest -q tests/test_cross_layer_architecture_conformance.py::test_l07_production_publication_separates_provider_effect_from_intent
      - name: Contract 5
        run: pytest -q tests/test_cross_layer_architecture_conformance.py::test_l14_production_pipeline_requires_server_authoritative_mode_and_workflow_identity
      - name: Existing contract 1
        run: pytest -q tests/test_production_architecture_contracts.py::test_repository_has_exactly_23_architectural_layers
      - name: Existing contract 2
        run: pytest -q tests/test_production_architecture_contracts.py::test_every_architectural_layer_contains_python_implementation
      - name: Existing contract 3
        run: pytest -q tests/test_production_architecture_contracts.py::test_image_orchestration_fails_closed_without_real_provider
      - name: Existing contract 4
        run: pytest -q tests/test_production_architecture_contracts.py::test_learning_actions_require_observed_outcomes
      - name: Existing contract 5
        run: pytest -q tests/test_production_architecture_contracts.py::test_learning_action_completion_uses_explicit_observed_outcome
      - name: Existing contract 6
        run: pytest -q tests/test_production_architecture_contracts.py::test_ci_declares_postgres_service
      - name: Existing contract 7
        run: pytest -q tests/test_production_architecture_contracts.py::test_production_code_does_not_default_to_mock_image_provider
      - name: Verify PostgreSQL schema and migrations
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from layers.layer13_persistence.modules.postgresql.migrations.schema import (
              TABLES, get_all_indexes_sql, get_all_migration_sql
          )
          conn = psycopg2.connect(
              host=os.environ["POSTGRES_HOST"], port=os.environ["POSTGRES_PORT"],
              dbname=os.environ["POSTGRES_DB"], user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          )
          try:
              with conn:
                  with conn.cursor() as cur:
                      for table in TABLES:
                          cur.execute(
                              f"CREATE TABLE IF NOT EXISTS {table['name']} ({', '.join(table['columns'])})"
                          )
                      for sql in get_all_migration_sql():
                          cur.execute(sql)
                      for sql in get_all_indexes_sql():
                          cur.execute(sql)
                      cur.execute("SELECT indexname FROM pg_indexes WHERE tablename='durable_tasks' AND indexname='uq_durable_tasks_dedupe'")
                      assert cur.fetchone(), "canonical durable-task dedupe index missing"
                      cur.execute("SELECT 1 FROM pg_constraint WHERE conname='durable_tasks_dedupe_key_key'")
                      assert cur.fetchone() is None, "redundant durable_tasks dedupe constraint remains"
          finally:
              conn.close()
          print("POSTGRES_SCHEMA_MIGRATION=PASS")
