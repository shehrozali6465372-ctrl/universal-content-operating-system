name: UCOS Deep E2E Live System Test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ucOS-deep-e2e-live.yml

permissions:
  contents: read

concurrency:
  group: ucos-deep-e2e-live
  cancel-in-progress: false

jobs:
  deep-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_VERSION: v25.0

    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v4

      - name: System inventory and structural checks
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UCOS REPOSITORY INVENTORY ==="
          echo "COMMIT=${GITHUB_SHA}"
          echo "BRANCH=${GITHUB_REF_NAME}"
          echo "TOP_LEVEL:"
          find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort
          echo "LAYER_DIRECTORIES:"
          find layers -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort || true
          LAYER_COUNT=$(find layers -maxdepth 1 -mindepth 1 -type d -name 'layer*' | wc -l | tr -d ' ')
          echo "LAYER_COUNT=${LAYER_COUNT}"
          if [ "${LAYER_COUNT}" -lt 23 ]; then
            echo "STRUCTURE_RESULT=FAIL_EXPECTED_AT_LEAST_23_LAYERS"
            exit 10
          fi
          for f in \
            layers/layer14_enterprise_integration/modules/api_gateway/api_gateway.py \
            layers/layer23_website_manager/integration/atoz_bridge.py \
            layers/layer23_website_manager/integration/__init__.py; do
            if [ -f "${f}" ]; then
              echo "KEY_FILE_PRESENT=${f}"
            else
              echo "KEY_FILE_MISSING=${f}"
              exit 11
            fi
          done
          echo "STRUCTURE_RESULT=PASS"

      - name: Compile every Python source file
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m compileall -q .
          echo "PYTHON_COMPILE_RESULT=PASS"

      - name: Run repository test suite when present
        shell: bash
        run: |
          set -uo pipefail
          TEST_FILES=$(find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | wc -l | tr -d ' ')
          echo "TEST_FILE_COUNT=${TEST_FILES}"
          if [ "${TEST_FILES}" -eq 0 ]; then
            echo "PYTEST_RESULT=NO_TEST_FILES_FOUND"
            exit 0
          fi
          if ! command -v pytest >/dev/null 2>&1; then
            python3 -m pip install -q pytest
          fi
          python3 -m pytest -q
          RC=$?
          if [ "${RC}" -eq 0 ]; then
            echo "PYTEST_RESULT=PASS"
          else
            echo "PYTEST_RESULT=FAIL"
            exit "${RC}"
          fi

      - name: Static integration trace for UCOS orchestration paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("layers")]
          files = [p for r in roots if r.exists() for p in r.rglob("*.py")]
          text = "\n".join(p.read_text(errors="ignore") for p in files)
          checks = {
              "LAYER23_BRIDGE": "atoz_bridge.py" in [p.name for p in files],
              "API_GATEWAY": "api_gateway.py" in [p.name for p in files],
              "JOB_ROUTE": "/v1/jobs" in text,
              "HEARTBEAT_ROUTE": "/heartbeat" in text,
              "HMAC": "hmac" in text.lower(),
              "WEBSITE_MANAGER": "layer23_website_manager" in text,
          }
          for k, v in checks.items():
              print(f"TRACE_{k}={'PASS' if v else 'FAIL'}")
          if not all(checks.values()):
              raise SystemExit(20)
          print(f"PYTHON_SOURCE_FILE_COUNT={len(files)}")
          print("STATIC_INTEGRATION_TRACE=PASS")
          PY

      - name: Live Meta authentication, account discovery, and REAL 23-account publishing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          TOKEN = os.environ["META_ACCESS_TOKEN"]
          VERSION = os.environ["META_GRAPH_VERSION"]
          BASE = f"https://graph.facebook.com/{VERSION}"
          RUN_MARKER = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          TEST_TAG = f"UCOS-E2E-REAL-LIVE-TEST {RUN_MARKER}"

          if not TOKEN:
              print("META_TOKEN_PRESENT=FAIL")
              raise SystemExit(30)
          print("META_TOKEN_PRESENT=PASS")

          FB_POSTS = {
              "DealNest Daily": "UCOS E2E live test — smart shopping: compare real prices, reviews, and useful features before buying.",
              "FitNest Daily": "UCOS E2E live test — build fitness through repeatable training, daily movement, recovery, and balanced habits.",
              "KitchenNest Daily": "UCOS E2E live test — practical kitchen systems: prep first, keep tools accessible, and clean as you go.",
              "GlowNest Daily": "UCOS E2E live test — keep skincare practical: gentle cleansing, sun protection, and a routine you can maintain.",
              "PawTech Daily": "UCOS E2E live test — useful pet technology should support everyday care, attention, play, and responsible ownership.",
              "AI Tools Daily": "UCOS E2E live test — automate one repetitive task, verify the output, and measure whether the workflow saves time.",
              "HomeCraft Daily": "UCOS E2E live test — measure, plan materials, and start with a small reversible home improvement change.",
              "WellnessNest Daily": "UCOS E2E live test — sustainable wellness starts with repeatable basics: sleep, movement, nutrition, hydration, and recovery.",
              "BabyNest Daily": "UCOS E2E live test — simple preparation and flexible routines can make busy parenting days easier.",
              "MoneyWise Daily": "UCOS E2E live test — track income, fixed costs, flexible spending, savings, and debt using real numbers.",
              "jungle toon": "UCOS E2E live test — imagination turns ordinary moments into playful stories, drawings, and adventures.",
              "deeplora": "UCOS E2E live test — ask what something does, why it matters, and what evidence supports it before accepting a claim."
          }

          IG_POSTS = {
              "vellorastyle100": ("UCOS E2E live test — personal style starts with pieces you genuinely enjoy wearing. #Fashion #Style", "https://images.unsplash.com/photo-1445205170230-053b83016050?fm=jpg&fit=crop&w=1080&q=85"),
              "lumevora.beauty": ("UCOS E2E live test — keep beauty practical with gentle care, sun protection, and products that suit your routine. #Beauty #Skincare", "https://images.unsplash.com/photo-1596462502278-27bfdc403348?fm=jpg&fit=crop&w=1080&q=85"),
              "aivora100": ("UCOS E2E live test — start AI with one real problem, clear context, verification, and measurable results. #AI #AITools", "https://images.unsplash.com/photo-1677442136019-21780ecad995?fm=jpg&fit=crop&w=1080&q=85"),
              "wellvorahub": ("UCOS E2E live test — protect sleep, move regularly, eat nourishing food, and build repeatable recovery habits. #Wellness", "https://images.unsplash.com/photo-1506126613408-eca07ce68773?fm=jpg&fit=crop&w=1080&q=85"),
              "petvoracare": ("UCOS E2E live test — combine attention, play, organized essentials, and useful tools for better pet care. #PetCare", "https://images.unsplash.com/photo-1450778869180-41d0601e046e?fm=jpg&fit=crop&w=1080&q=85"),
              "maje_rcim": ("UCOS E2E live test — financial visibility starts with tracking income, essential costs, savings, and debt. #Finance #MoneyTips", "https://images.unsplash.com/photo-1559526324-593bc073d938?fm=jpg&fit=crop&w=1080&q=85"),
              "homeloradaily": ("UCOS E2E live test — useful home design starts with storage, flow, and practical improvements before decoration. #Home #InteriorDesign", "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?fm=jpg&fit=crop&w=1080&q=85"),
              "ecoveloradaily": ("UCOS E2E live test — reuse, reduce unnecessary purchases, repair when practical, and choose durable options. #Sustainability #EcoLiving", "https://images.unsplash.com/photo-1497435334941-8c899ee9e8e9?fm=jpg&fit=crop&w=1080&q=85"),
              "prodivolab": ("UCOS E2E live test — before buying, ask whether a product solves a real problem, gets regular use, and justifies its price. #ProductDiscovery", "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?fm=jpg&fit=crop&w=1080&q=85"),
              "fitvorahq": ("UCOS E2E live test — consistency beats all-or-nothing training; recover properly and progress gradually. #Fitness #Workout", "https://images.unsplash.com/photo-1538805060514-97d9cc17730c?fm=jpg&fit=crop&w=1080&q=85"),
              "kingmakerbnb": ("UCOS E2E live test — great short stays depend on accurate listings, clean spaces, clear check-in, and communication. #Airbnb #Hospitality", "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?fm=jpg&fit=crop&w=1080&q=85")
          }

          def request(method, path, params):
              if method == "GET":
                  url = BASE + path + "?" + urllib.parse.urlencode(params)
                  req = urllib.request.Request(url, method="GET")
              else:
                  body = urllib.parse.urlencode(params).encode()
                  req = urllib.request.Request(BASE + path, data=body, headers={"Content-Type":"application/x-www-form-urlencoded"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  try: return e.code, json.loads(raw)
                  except Exception: return e.code, {"error":{"message":raw[:1000]}}

          st, me = request("GET", "/me", {"fields":"id,name","access_token":TOKEN})
          print(f"META_AUTH_HTTP={st}")
          if st != 200 or "id" not in me:
              print("META_AUTH_RESULT=FAIL")
              raise SystemExit(31)
          print(f"META_AUTH_RESULT=PASS id={me['id']} name={me.get('name','')}")

          st, payload = request("GET", "/me/accounts", {
              "fields":"id,name,access_token,tasks,instagram_business_account{id,username,name}",
              "limit":"100","access_token":TOKEN
          })
          print(f"ACCOUNT_DISCOVERY_HTTP={st}")
          if st != 200 or "data" not in payload:
              print("ACCOUNT_DISCOVERY_RESULT=FAIL")
              raise SystemExit(32)

          pages=payload["data"]
          print(f"FACEBOOK_ACCOUNT_COUNT={len(pages)}")
          if len(pages) != 12:
              raise SystemExit(33)

          fb_success=0; ig_success=0; fb_verify=0; ig_verify=0
          seen_ig=[]

          for page in pages:
              name=str(page.get("name",""))
              pid=str(page.get("id",""))
              pt=page.get("access_token")
              if name not in FB_POSTS:
                  print(f"FACEBOOK_UNMAPPED name={name}")
                  raise SystemExit(34)

              st, out=request("POST", f"/{pid}/feed", {
                  "message": f"{FB_POSTS[name]} {TEST_TAG}",
                  "access_token":pt
              })
              post_id=out.get("id") if st==200 else None
              if not post_id:
                  print(f"FACEBOOK_POST_FAIL name={name} http={st} error={json.dumps(out.get('error',out),separators=(',',':'))[:500]}")
                  continue
              fb_success += 1
              print(f"FACEBOOK_REAL_POST_PASS name={name} id={post_id}")

              vst, vout=request("GET", f"/{post_id}", {"fields":"id,message,created_time","access_token":pt})
              if vst==200 and vout.get("id")==post_id and TEST_TAG in vout.get("message",""):
                  fb_verify += 1
                  print(f"FACEBOOK_REAL_VERIFY_PASS name={name} id={post_id}")
              else:
                  print(f"FACEBOOK_VERIFY_FAIL name={name} http={vst}")

              ig=page.get("instagram_business_account") or {}
              username=str(ig.get("username",""))
              igid=str(ig.get("id",""))
              if username:
                  seen_ig.append(username)
              if username not in IG_POSTS or not igid:
                  continue

              caption,image=IG_POSTS[username]
              st,c=request("POST", f"/{igid}/media", {
                  "image_url":image,
                  "caption":f"{caption} {TEST_TAG}",
                  "access_token":pt
              })
              cid=c.get("id") if st==200 else None
              if not cid:
                  print(f"INSTAGRAM_CREATE_FAIL username={username} http={st} error={json.dumps(c.get('error',c),separators=(',',':'))[:500]}")
                  continue

              ready=False; status_code=None
              for _ in range(18):
                  time.sleep(5)
                  s, state=request("GET", f"/{cid}", {"fields":"status_code,status","access_token":pt})
                  status_code=state.get("status_code")
                  if s==200 and status_code=="FINISHED":
                      ready=True; break
                  if status_code in {"ERROR","EXPIRED"}:
                      break
              if not ready:
                  print(f"INSTAGRAM_CONTAINER_FAIL username={username} status={status_code}")
                  continue

              st3,p=request("POST", f"/{igid}/media_publish", {"creation_id":cid,"access_token":pt})
              mid=p.get("id") if st3==200 else None
              if not mid:
                  print(f"INSTAGRAM_PUBLISH_FAIL username={username} http={st3} error={json.dumps(p.get('error',p),separators=(',',':'))[:500]}")
                  continue
              ig_success += 1
              print(f"INSTAGRAM_REAL_POST_PASS username={username} id={mid}")

              vst,vout=request("GET", f"/{mid}", {"fields":"id,caption,timestamp,permalink,media_type","access_token":pt})
              if vst==200 and vout.get("id")==mid and TEST_TAG in vout.get("caption",""):
                  ig_verify += 1
                  print(f"INSTAGRAM_REAL_VERIFY_PASS username={username} id={mid} permalink={vout.get('permalink','')}")
              else:
                  print(f"INSTAGRAM_VERIFY_FAIL username={username} http={vst}")

          print(f"FACEBOOK_POST_RESULT success={fb_success}/12 verified={fb_verify}/12")
          print(f"INSTAGRAM_POST_RESULT success={ig_success}/11 verified={ig_verify}/11")
          print(f"INSTAGRAM_DISCOVERED_COUNT={len(set(seen_ig))}")

          if fb_success != 12 or fb_verify != 12 or ig_success != 11 or ig_verify != 11:
              print("FINAL_RESULT=FAIL")
              raise SystemExit(35)
          print("FINAL_RESULT=PASS_REAL_23_POSTS_AND_23_VERIFICATIONS")
          PY

# E2E workflow revision marker
