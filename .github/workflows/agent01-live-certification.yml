name: UCOS Agent 01 Real Production Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent01-live-certification.yml"
      - "agents/**"
      - "scripts/agent01_*.py"
      - "layers/layer14_enterprise_integration/modules/api_gateway/api_gateway.py"
      - "layers/layer07_publishing/modules/account_control/account_registry.py"
      - "layers/layer07_publishing/modules/account_control/account_data_store.py"
      - "layers/layer13_persistence/**"
      - "layers/layer17_security/modules/credential_resolver/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ucos-agent01-real-production-validation
  cancel-in-progress: false

jobs:
  real-live-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      APP_ENV: production
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      UCOS_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.UCOS_CREDENTIAL_ENCRYPTION_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      UCOS_API_BASE_URL: https://ucos-backend.onrender.com
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Verify required production secrets are present without printing values
        env:
          HAS_NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL != '' }}
          HAS_UCOS_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.UCOS_CREDENTIAL_ENCRYPTION_KEY != '' }}
        run: |
          set -euo pipefail
          test "$HAS_NEON_DATABASE_URL" = "true" || { echo "::error::NEON_DATABASE_URL is missing"; exit 2; }
          test "$HAS_UCOS_CREDENTIAL_ENCRYPTION_KEY" = "true" || { echo "::error::UCOS_CREDENTIAL_ENCRYPTION_KEY is missing"; exit 2; }
          echo "REAL_DATABASE_AND_ENCRYPTION_CONFIGURATION=CONFIGURED"
          echo "DERIVED_HMAC_DEPLOYED_API_CONFIGURATION=CONFIGURED"
          echo "Tavily is optional; when absent, the real keyless GDELT Context API is attempted. Provider failures remain blocking."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile real production gate
        run: python -m compileall -q agents scripts layers/layer07_publishing/modules/account_control layers/layer13_persistence layers/layer17_security

      - name: Import history and smoke-test every enabled Pinterest account through the deployed UCOS API
        run: python -m scripts.agent01_live_certification_gate --max-pages 100
