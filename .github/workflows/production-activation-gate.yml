name: UCOS Production Certificate Gate
on:
  # Full certification currently includes a real social-post E2E. Run only after
  # the operator separately reviewed and explicitly authorized that post.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile source
        run: python -m compileall -q layers/layer07_publishing layers/layer13_persistence layers/layer14_enterprise_integration layers/layer15_async_runtime main.py
      - name: Verify current revision CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="pending"
          for attempt in {1..180}; do
            result="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50")"
            state="$(python -c 'import json,sys; d=json.load(sys.stdin); r=[x for x in d["workflow_runs"] if x["name"]=="CI" and x["head_sha"]==sys.argv[1]]; ok=[x for x in r if x["status"]=="completed" and x["conclusion"]=="success"]; bad=[x for x in r if x["status"]=="completed" and x["conclusion"] not in ("success","cancelled")]; print("success" if ok else ("fail" if bad else "pending"))' "${{ github.sha }}" <<<"$result")"
            [ "$state" = success ] && break
            [ "$state" = fail ] && { echo "CURRENT_REVISION_CI=FAIL"; exit 1; }
            sleep 10
          done
          if [ "$state" != success ]; then
            echo "CURRENT_REVISION_CI=FAIL"
            echo "Timed out waiting for current revision CI."
            exit 1
          fi
          echo "CURRENT_REVISION_CI=PASS"
      - name: Verify current revision architecture conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="pending"
          for attempt in {1..180}; do
            result="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50")"
            state="$(python -c "import json,sys; d=json.load(sys.stdin); sha=sys.argv[1]; r=[x for x in d['workflow_runs'] if x['head_sha']==sha and x['name']=='UCOS Cross-Layer Architecture Conformance']; print('success' if any(x['status']=='completed' and x['conclusion']=='success' for x in r) else ('fail' if any(x['status']=='completed' and x['conclusion'] not in ('success','cancelled') for x in r) else 'pending'))" "${{ github.sha }}" <<<"$result")"
            [ "$state" = success ] && break
            [ "$state" = fail ] && { echo "CURRENT_REVISION_ARCHITECTURE_CONFORMANCE=FAIL"; exit 1; }
            sleep 10
          done
          if [ "$state" != success ]; then
            echo "CURRENT_REVISION_ARCHITECTURE_CONFORMANCE=FAIL"
            exit 1
          fi
          echo "CURRENT_REVISION_ARCHITECTURE_CONFORMANCE=PASS"
      - name: Verify live production endpoints
        run: |
          set -euo pipefail
          for i in {1..6}; do
            rm -f /tmp/browser-console.html
            code="$(curl --max-time 20 -sS -o /tmp/browser-console.html -w '%{http_code}' https://ucos-personal-browser.onrender.com/console || true)"
            if [ "$code" = "200" ] && grep -q '<title>UCOS Personal Browser Console</title>' /tmp/browser-console.html; then
              echo "BROWSER_PUBLIC_CONSOLE=PASS"
              break
            fi
            [ "$i" -eq 6 ] && { cat /tmp/browser-console.html || true; echo "BROWSER_PUBLIC_CONSOLE=FAIL"; exit 1; }
            sleep 10
          done
          for i in {1..6}; do
            rm -f /tmp/browser-health.json
            code="$(curl --max-time 20 -sS -o /tmp/browser-health.json -w '%{http_code}' https://ucos-personal-browser.onrender.com/health || true)"
            if [ "$code" = "401" ] && grep -q 'authentication required' /tmp/browser-health.json; then
              echo "BROWSER_HEALTH_AUTH_FAIL_CLOSED=PASS"
              break
            fi
            [ "$i" -eq 6 ] && { cat /tmp/browser-health.json || true; echo "BROWSER_HEALTH_AUTH_FAIL_CLOSED=FAIL"; exit 1; }
            sleep 10
          done
          for i in {1..6}; do
            rm -f /tmp/healthz.json
            code="$(curl --max-time 20 -sS -o /tmp/healthz.json -w '%{http_code}' https://ucos-backend.onrender.com/healthz || true)"
            if [ "$code" = "200" ] && grep -q '"status": "ok"' /tmp/healthz.json; then
              echo "UCOS_API_HEALTHZ=PASS"
              break
            fi
            [ "$i" -eq 6 ] && { cat /tmp/healthz.json || true; echo "UCOS_API_HEALTHZ=FAIL"; exit 1; }
            sleep 10
          done
          for i in {1..6}; do
            rm -f /tmp/auth.json
            code="$(curl --max-time 20 -sS -o /tmp/auth.json -w '%{http_code}' https://ucos-backend.onrender.com/health || true)"
            if [ "$code" = "401" ] && grep -q 'API authentication required' /tmp/auth.json; then
              echo "UCOS_API_AUTH_FAIL_CLOSED=PASS"
              break
            fi
            [ "$i" -eq 6 ] && { cat /tmp/auth.json || true; echo "UCOS_API_AUTH_FAIL_CLOSED=FAIL"; exit 1; }
            sleep 10
          done
          echo "LIVE_ENDPOINTS=PASS"
      - name: Determine whether publishing pipeline E2E is required
        id: e2e-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "REAL_PROVIDER_E2E_SCOPE=MANUAL_DISPATCH"
            exit 0
          fi
          required=false
          if [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            EVENT_BEFORE="$(git rev-list --max-parents=0 "$EVENT_SHA")"
          fi
          while IFS= read -r path; do
            case "$path" in
              layers/layer07_publishing/*|layers/layer10_monetization/*|layers/layer12_ai_foundation/*|layers/layer13_persistence/*|layers/layer15_async_runtime/*|layers/layer17_security/*|layers/layer14_enterprise_integration/modules/real_integrations/gateway.py|layers/layer14_enterprise_integration/modules/master_orchestrator/pipeline_wiring.py|layers/layer14_enterprise_integration/modules/master_orchestrator/production_pipeline.py)
                required=true
                ;;
            esac
          done < <(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA")
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "REAL_PROVIDER_E2E_REQUIRED=$required"
      - name: Verify current revision real-provider E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.e2e-scope.outputs.required }}" != "true" ]]; then
            echo "CURRENT_REVISION_REAL_PROVIDER_E2E=NOT_REQUIRED_PUBLISHING_PIPELINE_UNCHANGED"
            exit 0
          fi
          state="pending"
          for attempt in {1..180}; do
            result="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50")"
            state="$(python -c 'import json,sys; d=json.load(sys.stdin); sha=sys.argv[1]; r=[x for x in d["workflow_runs"] if x["head_sha"]==sha and x["name"]=="UCOS Full End-to-End One Real Autonomous Post"]; print("success" if any(x["status"]=="completed" and x["conclusion"]=="success" for x in r) else ("fail" if any(x["status"]=="completed" and x["conclusion"] not in ("success","cancelled") for x in r) else "pending"))' "${{ github.sha }}" <<<"$result")"
            [ "$state" = success ] && break
            [ "$state" = fail ] && { echo "CURRENT_REVISION_REAL_PROVIDER_E2E=FAIL"; exit 1; }
            sleep 10
          done
          if [ "$state" != success ]; then
            echo "CURRENT_REVISION_REAL_PROVIDER_E2E=FAIL"
            exit 1
          fi
          echo "CURRENT_REVISION_REAL_PROVIDER_E2E=PASS"
      - name: Verify real-provider readiness gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="pending"
          for attempt in {1..180}; do
            result="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50")"
            state="$(python -c 'import json,sys; d=json.load(sys.stdin); sha=sys.argv[1]; r=[x for x in d["workflow_runs"] if x["head_sha"]==sha and x["name"]=="UCOS Production Provider Readiness"]; print("success" if any(x["status"]=="completed" and x["conclusion"]=="success" for x in r) else ("fail" if any(x["status"]=="completed" and x["conclusion"] not in ("success","cancelled") for x in r) else "pending"))' "${{ github.sha }}" <<<"$result")"
            [ "$state" = success ] && break
            [ "$state" = fail ] && { echo "LIVE_PROVIDER_READINESS=FAIL"; exit 1; }
            sleep 10
          done
          if [ "$state" != success ]; then
            echo "LIVE_PROVIDER_READINESS=FAIL"
            exit 1
          fi
          echo "LIVE_PROVIDER_READINESS=PASS"
      - name: Final certificate marker
        run: |
          echo "PRODUCTION_CERTIFICATE=PASS"
          echo "CERTIFICATION_SCOPE=CI+live-endpoints+current-revision-real-provider-E2E+provider-readiness"
