name: UCOS Production Certificate Gate
# Final evidence gate: source tests + live endpoints + real-provider readiness.


on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-activation-gate.yml"
      - ".github/workflows/production-live-smoke.yml"
      - ".github/workflows/production-browser-live-smoke.yml"
      - ".github/workflows/production-provider-readiness.yml"
      - "main.py"
      - "layers/layer14_enterprise_integration/**"
      - "layers/layer07_publishing/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      UCOS_SERPAPI_API_KEY: ${{ secrets.UCOS_SERPAPI_API_KEY }}
      UCOS_AFFILIATE_BASE_URL: ${{ secrets.UCOS_AFFILIATE_BASE_URL }}
      UCOS_AFFILIATE_API_KEY: ${{ secrets.UCOS_AFFILIATE_API_KEY }}
      UCOS_AFFILIATE_SEARCH_PATH: ${{ secrets.UCOS_AFFILIATE_SEARCH_PATH }}
      UCOS_GA4_PROPERTY_ID: ${{ secrets.UCOS_GA4_PROPERTY_ID }}
      UCOS_GA4_ACCESS_TOKEN: ${{ secrets.UCOS_GA4_ACCESS_TOKEN }}
      UCOS_GA4_PROJECT_ID: ${{ secrets.UCOS_GA4_PROJECT_ID }}
      UCOS_WORDPRESS_URL: ${{ secrets.UCOS_WORDPRESS_URL }}
      UCOS_WORDPRESS_USERNAME: ${{ secrets.UCOS_WORDPRESS_USERNAME }}
      UCOS_WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.UCOS_WORDPRESS_APPLICATION_PASSWORD }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Compile source
        run: python -m compileall -q layers dashboard main.py

      - name: Repository regression suite
        run: pytest -q

      - name: Verify live production endpoints
        run: |
          set -euo pipefail
          browser_code="$(curl -sS -o /tmp/browser.json -w '%{http_code}' https://ucos-personal-browser.onrender.com/ || true)"
          test "$browser_code" = "200"
          grep -q '"status":"ok"' /tmp/browser.json
          api_code="$(curl -sS -o /tmp/healthz.json -w '%{http_code}' https://ucos-backend.onrender.com/healthz || true)"
          test "$api_code" = "200"
          grep -q '"status": "ok"' /tmp/healthz.json
          auth_code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' https://ucos-backend.onrender.com/health || true)"
          test "$auth_code" = "401"
          grep -q 'API authentication required' /tmp/auth.json
          echo "LIVE_ENDPOINTS=PASS"

      - name: Evaluate real integration readiness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from layers.layer14_enterprise_integration.modules.real_integrations import IntegrationConfig

          status = IntegrationConfig.from_env().status()
          print(json.dumps(status, indent=2, sort_keys=True))

          if not status["validation"]["valid"]:
              raise SystemExit("Production integration configuration is invalid")

          providers = {
              k: v for k, v in status.items()
              if k in {"serpapi", "affiliate_network", "google_analytics_4", "wordpress"}
          }

          missing = [name for name, configured in providers.items() if not configured]
          if missing:
              raise SystemExit(
                  "LIVE_PROVIDER_ACTIVATION_BLOCKED: missing real credentials/configuration for: "
                  + ", ".join(missing)
              )

          print("LIVE_PROVIDER_CONFIGURATION=READY")
          print("NOTE=Credential presence is not provider health. A live E2E run is required for LIVE_PROVIDER_VERIFIED.")
          PY

      - name: Integration status
        run: python main.py --integration-status

      - name: Final certificate marker
        run: |
          echo "PRODUCTION_CERTIFICATE=PASS"
          echo "CERTIFICATION_SCOPE=tests+live-endpoints+real-provider-configuration"

