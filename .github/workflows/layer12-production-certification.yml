name: Layer 12 Production Certification

on:
  push:
    branches: [main]
    paths:
      - "layers/layer12_ai_foundation/**"
      - "tests/test_layer12_ai_foundation.py"
      - "tests/test_layer12_production_contracts.py"
      - ".github/workflows/layer12-production-certification.yml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "layers/layer12_ai_foundation/**"
      - "tests/test_layer12_ai_foundation.py"
      - "tests/test_layer12_production_contracts.py"
      - ".github/workflows/layer12-production-certification.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layer12-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      UCOS_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Layer 12
        run: python -m compileall -q layers/layer12_ai_foundation

      - name: Layer 12 production contracts
        run: python -m pytest tests/test_layer12_production_contracts.py -q --tb=short

      - name: Layer 12 unit suite
        run: python -m pytest tests/test_layer12_ai_foundation.py -q --tb=short

      - name: Layer 12 production-source lint
        run: |
          ruff check layers/layer12_ai_foundation --select E9,F821,F822,F823,F811,F812 --ignore E501,E402
