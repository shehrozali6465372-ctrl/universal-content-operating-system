name: UCOS Production Provider Readiness

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-22.04
    env:
      UCOS_SERPAPI_API_KEY: ${{ secrets.UCOS_SERPAPI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      UCOS_AFFILIATE_SEARCH_URL: ${{ secrets.UCOS_AFFILIATE_SEARCH_URL }}
      UCOS_AFFILIATE_API_TOKEN: ${{ secrets.UCOS_AFFILIATE_API_TOKEN }}
      UCOS_GA4_PROPERTY_ID: ${{ secrets.UCOS_GA4_PROPERTY_ID }}
      UCOS_GA4_ACCESS_TOKEN: ${{ secrets.UCOS_GA4_ACCESS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Verify required live provider credentials
        shell: bash
        run: |
          set -euo pipefail
          present() { [ -n "${!1:-}" ]; }
          serpapi_ok=false
          present UCOS_SERPAPI_API_KEY || present SERPAPI_API_KEY && serpapi_ok=true
          missing=""
          $serpapi_ok || missing="${missing} UCOS_SERPAPI_API_KEY"
          present UCOS_AFFILIATE_SEARCH_URL || missing="${missing} UCOS_AFFILIATE_SEARCH_URL"
          present UCOS_AFFILIATE_API_TOKEN || missing="${missing} UCOS_AFFILIATE_API_TOKEN"
          present UCOS_GA4_PROPERTY_ID || missing="${missing} UCOS_GA4_PROPERTY_ID"
          present UCOS_GA4_ACCESS_TOKEN || missing="${missing} UCOS_GA4_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "LIVE_PROVIDER_READINESS=BLOCKED"
            echo "MISSING_REQUIRED_SECRET_NAMES=$missing"
            exit 1
          fi
          echo "LIVE_PROVIDER_READINESS=PASS"

      - name: Verify DeepSeek real provider
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          code="$(curl -sS -o /tmp/deepseek.json -w '%{http_code}' https://api.deepseek.com/chat/completions -H 'Content-Type: application/json' -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" --data '{"model":"deepseek-chat","messages":[{"role":"user","content":"Reply with exactly: UCOS_DEEPSEEK_OK"}],"max_tokens":8,"stream":false}')"
          test "$code" = "200"
          echo "DEEPSEEK_API_TEST=PASS"
