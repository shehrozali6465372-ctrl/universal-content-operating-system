name: UCOS Production Provider Readiness

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-22.04
    env:
      UCOS_SERPAPI_API_KEY: ${{ secrets.UCOS_SERPAPI_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      UCOS_AFFILIATE_SEARCH_URL: ${{ secrets.UCOS_AFFILIATE_SEARCH_URL }}
      UCOS_AFFILIATE_API_TOKEN: ${{ secrets.UCOS_AFFILIATE_API_TOKEN }}
      UCOS_GA4_PROPERTY_ID: ${{ secrets.UCOS_GA4_PROPERTY_ID }}
      UCOS_GA4_ACCESS_TOKEN: ${{ secrets.UCOS_GA4_ACCESS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Evaluate provider readiness
        shell: bash
        run: |
          set -euo pipefail
          present() { [ -n "${!1:-}" ]; }

          present DEEPSEEK_API_KEY
          echo "DEEPSEEK=CONFIGURED"

          if present UCOS_SERPAPI_API_KEY || present SERPAPI_API_KEY; then
            echo "SERPAPI=CONFIGURED"
          else
            echo "SERPAPI=UNCONFIGURED_OPTIONAL"
          fi

          if present UCOS_AFFILIATE_SEARCH_URL && present UCOS_AFFILIATE_API_TOKEN; then
            echo "AFFILIATE=CONFIGURED"
          else
            echo "AFFILIATE=UNCONFIGURED_OPTIONAL"
          fi

          if present UCOS_GA4_PROPERTY_ID && present UCOS_GA4_ACCESS_TOKEN; then
            echo "GA4=CONFIGURED"
          else
            echo "GA4=UNCONFIGURED_OPTIONAL"
          fi

          echo "LIVE_PROVIDER_READINESS=PASS_CORE_PROVIDER"
